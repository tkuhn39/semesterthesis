name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gearcore:
    name: Lint, type-check, test (gearcore + notebooks)
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    defaults:
      run:
        working-directory: 20_code/10_gearcore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (package, tests, notebooks)
        run: ruff check . ../../40_jupyter-notebooks

      - name: Ruff format check
        run: ruff format --check . ../../40_jupyter-notebooks

      - name: Type check (strict on the package)
        run: mypy --strict src scripts

      - name: Tests
        run: pytest

      - name: Notebooks execute without assertion failures
        run: pytest --nbmake --nbmake-timeout=300 ../../40_jupyter-notebooks
