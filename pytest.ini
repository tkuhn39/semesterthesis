# Guard for the repository root. The package has its own configuration in
# 20_code/10_gearcore/pyproject.toml; this file only applies when pytest is started above it.
# A bare `pytest` here must never collect the archived legacy workbench
# (30_references_and_examples/, read-only): its tests create folders relative to the working
# directory (incident 2026-09-29).
[pytest]
testpaths = 20_code/10_gearcore/tests
norecursedirs = 30_references_and_examples 00_literatur 10_report .* build dist node_modules
addopts = -ra --strict-markers
markers =
    eq(source, eq): links a test to a norm equation (source key from sources.yaml, equation label)
    oracle: compares against STplus oracle fixtures
