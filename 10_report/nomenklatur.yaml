# Auswahl der Formelzeichen, Indizes und Abkürzungen für Nomenklatur.tex (T3).
# scripts/build_nomenclature.py liest die Formelzeichen aus der Größenregistry
# (20_code/10_gearcore/src/gearcore/data/quantities.yaml) über die Schlüssel unter `registry`,
# ergänzt `extra` (Zeichen, die die Registry nicht führt; jedes mit Quelle und Seite, wie
# transkribiert) und schreibt die drei Tabellen. Danach durchsucht es die .tex-Dateien nach
# Formelzeichen, die in keiner Tabelle stehen, und meldet sie. Ein Zeichen wird hier eingetragen,
# bevor es im Text steht (Regel: jedes Symbol einmal in der Nomenklatur, keine Symboltabellen
# nach Formeln).
registry:
  # Verzahnung
  - number_of_teeth
  - normal_module
  - normal_pressure_angle
  - helix_angle
  - centre_distance
  - profile_shift_coefficient
  - face_width
  - reference_diameter
  - base_diameter
  - tip_diameter
  - generated_root_diameter
  - root_form_diameter
  - working_pitch_diameter
  - transverse_base_pitch
  - length_of_path_of_contact
  - transverse_contact_ratio
  - gear_ratio
  - span_measurement
  - number_of_teeth_spanned
  - basic_rack_profile_angle
  - tool_addendum
  - tool_tip_radius
  - tip_relief
  - rotation_speed
  - circumferential_velocity
  - transverse_working_pressure_angle
  - generating_profile_shift_coefficient
  - upper_generating_profile_shift_coefficient
  - mean_generating_profile_shift_coefficient
  - lower_generating_profile_shift_coefficient
  - tool_root_form_height
  - tip_chamfer_radial
  - residual_tip_thickness
  - measuring_ball_diameter
  - diametral_two_ball_dimension
  - tip_form_diameter
  # Messung
  - quality_grade
  - single_pitch_deviation
  - total_cumulative_pitch_deviation
  - individual_cumulative_pitch_deviation
  - sector_pitch_deviation
  - pitch_span_deviation
  - adjacent_pitch_difference
  - runout
  - total_profile_deviation
  - profile_slope_deviation
  - profile_form_deviation
  - total_helix_deviation
  - helix_slope_deviation
  - helix_form_deviation
  - arithmetic_mean_roughness
  - mean_peak_to_valley_roughness
  # Beanspruchung und Bemessung
  - modulus_of_elasticity
  - max_principal_stress
  - min_principal_stress
  - mises_stress
  - normal_stress_hypothesis_stress
  - equivalent_stress
  - equivalent_strain
  - permissible_strain
  - multiaxiality_degree
  - hill_equivalent_stress
  - hill_stress_ratio
  - stress_amplitude
  - component_stress_amplitude
  - mean_stress
  - component_alternating_strength
  - static_strength
  - static_component_strength
  - yield_stress
  - static_characteristic_value
  - static_reduction_factor
  - cyclic_reduction_factor
  - control_variable
  - shear_strength_factor
  - compressive_strength_factor
  - safety_factor
  - static_utilisation
  - cyclic_utilisation
  - cyclic_utilisation_mises
  - cyclic_utilisation_normal_stress
  - single_utilisation
  - mean_stress_factor
  - fatigue_life_factor
  - mean_stress_sensitivity
  - required_number_of_cycles
  - limit_number_of_cycles
  - woehler_slope_exponent
  # Fußrundungsvarianten
  - fillet_ellipse_inclination
  - fillet_ellipse_axis_ratio
  - bezier_control_factor
  - bionic_root_angle
  - bionic_circle_radius
