  series_20layers_bore33_pocket_round0p1f12_30perpitch_margin1_qs:
    purpose: "Taschenkörper-Serie (Vorlage, 2026-10-12): das Gegenstück der Wochenendserie auf dem Radkörper nach Zeichnung (Nabe, Steg, Taschen; das Netz ist byte-identisch mit frozen_mesh_20layers_bore33_pocket, auf dem das Mapping des Nutzers liegt), Kopfkante des starren Ritzels 0,1 mm mit 12 Facetten je Bogen, 30 Stellungen je Teilung, Rand 1,0 Teilung (99 Stellungen), Iterationsgrenzen 20/30/100, alle vier Werkstoffstufen W1 bis W4 bei Rate QS; 396 Dateien, erwartet rund 45 h (der Taschenkörper rechnete an C 215 statt 177 s, also etwa 27 min je Stellung) plus Extraktion. Vorgeschichte desselben Vormittags: die ersten Taschen-Karten des Nutzers (07.10.) enthielten keine *PLASTIC- und *POTENTIAL-Blöcke, der Kartenleser lehnte W2 ab; eine Fassung mit W1 und W3 allein wurde geschrieben und ungerechnet wieder gelöscht, nachdem der Nutzer die drei Taschen-Karten mit Plastizität neu exportiert hatte (12.10. 10:34 bis 10:45). Geprüft: *ELASTIC, *EXPANSION, *DENSITY, *PLASTIC und *POTENTIAL der neuen Taschen-Karten sind Zeile für Zeile identisch mit den Ringkarten derselben Rate, die Verteilung nennt alle 72932 Elemente des Taschen-Netzes. Zweck: Körpereinfluss über den ganzen Eingriffsweg je Stufe gegen die Ringserie (Drehung, Fußspannung über der Breite, Kantendruck, Lastaufteilung), Grundlage der Stommel-Auswertung auf dem Körper nach Zeichnung"
    outcome: "Vorlage"
    machine: "-"
