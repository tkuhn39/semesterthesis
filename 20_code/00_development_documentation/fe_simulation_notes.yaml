    outcome: "alle fünf durch; an E Kontakt an der scharfen Ritzelkopfkante (1 Zahn, keine Lastaufteilung)"
    machine: "Learning Edition"
  le_tests/positions_3teeth_1layers:
    purpose: "Stellungen A bis E mit 3 Zähnen (Vorlage)"
