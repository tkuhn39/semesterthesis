# Curated notes of the simulation diary (fe_simulation_log.md, generated by
# `build_fe_decks.py log`): one entry per output folder below 80_output/fe/<case>, keyed by the
# folder name relative to the case. The generator adds status, settings and key results from
# the files; this file holds what the files cannot say: the purpose of the run, the outcome in
# one sentence, the findings it belongs to (known_limits.md) and where it ran. Folders without
# an entry appear in the diary with "(keine Notiz)". Dates are those of the runs.
folders:
  convergence:
    purpose: "Konvergenzstudie in der Learning Edition: Einzahn-Sektor eben (CPE4, CPE4R, CPE4I) gegen den eigenen Solver"
    outcome: "Übereinstimmung mit dem eigenen Solver 7e-5 (CPE4) und 1e-5 (CPE4I)"
    machine: "Learning Edition"
    findings: [FE-09, FE-10]
  full_licence:
    purpose: "Konvergenzdecks für die Vollversion: fünf Stufen, drei Elementtypen, Volldecks mit 20, 40, 80 Schichten (Vorlage, nicht gerechnet)"
    outcome: "Vorlage; gerechnet in full_licence_result"
    machine: "-"
  full_licence_result:
    purpose: "Dieselben Konvergenzdecks, gerechnet auf der Vollversion 2026-10-06"
    outcome: "Richardson über die Abaqus-Reihe bestätigt die eigene Studie; 20, 40 und 80 Schichten innerhalb 0,05 % für Kopfverschiebung und Fußspannung"
    machine: "Vollversion"
    findings: [FE-09, FE-10]
  pilot_20layers_error:
    purpose: "Pilot 1 der Stellungsdatei: 20 Schichten, NLGEOM=YES, Fläche-zu-Fläche, Penalty"
    outcome: "SEAT und 8 Nm konvergiert (197 s), 12 Nm bricht im ersten Inkrement mit negativen Eigenwerten ab"
    machine: "Vollversion"
    findings: [FE-14]
  pilot_20layers_error_2:
    purpose: "Pilot 2: wie Pilot 1, aber geometrisch linear"
    outcome: "bis 12 Nm durch, 16 Nm bricht in Inkrement 2 durch eine Kontaktoszillation einer Flankenknotenspalte ab"
    machine: "Vollversion"
    findings: [FE-14, FE-15, FE-16]
  pilot_20layers_variants:
    purpose: "Sechs Löser- und Kontaktvarianten derselben Stellung C (Vorlage)"
    outcome: "Vorlage; gerechnet in pilot_20layers_variants_gerechnet"
    machine: "-"
  pilot_20layers_variants_gerechnet:
    purpose: "Sechs Löser- und Kontaktvarianten derselben Stellung C auf der Vollversion (2026-10-06)"
    outcome: "nur Knoten-zu-Fläche mit NLGEOM=NO läuft alle Schritte durch; jede NLGEOM=YES-Variante zeigt negative Eigenwerte ab dem ersten Lastinkrement"
    machine: "Vollversion"
    findings: [FE-14, FE-15, FE-16]
  pilot_20layers_c3d8_variants:
    purpose: "C3D8 statt C3D8I, linear und NLGEOM=YES (Vorlage)"
    outcome: "Vorlage; gerechnet in pilot_20layers_c3d8_variants_gerechnet"
    machine: "-"
  pilot_20layers_c3d8_variants_gerechnet:
    purpose: "Bestätigung des Elementtests auf dem feinen Netz: C3D8 linear und NLGEOM=YES"
    outcome: "beide Dateien alle Schritte ohne negativen Eigenwert; NLGEOM ≤ 0,7 %, C3D8 gegen C3D8I < 1 %"
    machine: "Vollversion"
    findings: [FE-10, FE-14]
  pilot_20layers:
    purpose: "Pilot mit der Regel je Werkstoffstufe (W1 linear C3D8I, Knoten-zu-Fläche), 20 Schichten, Bohrung 18,10 (Vorlage)"
    outcome: "Vorlage"
    machine: "-"
  pilot_40layers:
    purpose: "Pilot 40 Schichten (Vorlage)"
    outcome: "Vorlage; gerechnet in pilot_40layers_gerechnet"
    machine: "-"
  pilot_40layers_gerechnet:
    purpose: "Pilot 40 Schichten über die Breite"
    outcome: "416 s, alle Schritte; Momente und Drehung gegenüber 20 Schichten auf vier Stellen gleich"
    machine: "Vollversion"
    findings: [FE-08]
  pilot_80layers:
    purpose: "Pilot 80 Schichten (Vorlage)"
    outcome: "Vorlage; gerechnet in pilot_80layers_gerechnet"
    machine: "-"
  pilot_80layers_gerechnet:
    purpose: "Pilot 80 Schichten über die Breite"
    outcome: "1258 s, alle Schritte; CPRESS max +1 % gegenüber 20 Schichten"
    machine: "Vollversion"
    findings: [FE-08]
  pilot_20layers_deepbore:
    purpose: "Pilot mit tiefer Bohrung 12,38 mm (Vorlage)"
    outcome: "Vorlage; gerechnet in pilot_20layers_deepbore_gerechnet"
    machine: "-"
  pilot_20layers_deepbore_gerechnet:
    purpose: "Pilot mit tiefer Bohrung 12,38 mm: Steifigkeitsfrage der Bohrungstiefe"
    outcome: "177 s, alle Schritte; Momente gleich, Ritzeldrehung +2,0 %, CPRESS innerhalb 0,2 %"
    machine: "Vollversion"
    findings: [FE-08]
  pilot_20layers_positions:
    purpose: "Stellungen A bis E auf dem feinen Netz (Vorlage)"
    outcome: "Vorlage; gerechnet in pilot_20layers_positions_gerechnet"
    machine: "-"
  pilot_20layers_positions_gerechnet:
    purpose: "Stellungen A bis E auf dem feinen Netz: Kinematik, Lastaufteilung, Kantenlast des Ritzelkopfs"
    outcome: "alle fünf durch (162 bis 180 s); Kraft in den Doppeleingriffszonen innerhalb 0,2° der Eingriffslinie; Kantenlast des scharfen Ritzelkopfs an B und E"
    machine: "Vollversion"
    findings: [FE-15, FE-16, FE-17]
  pilot_20layers_smooth_variants:
    purpose: "Knoten-zu-Fläche mit SMOOTH 0,2 und SMOOTH 0 (Vorlage)"
    outcome: "Vorlage; gerechnet in pilot_20layers_smooth_variants_gerechnet"
    machine: "-"
  pilot_20layers_smooth_variants_gerechnet:
    purpose: "Ursache des Fläche-zu-Fläche-Abbruchs: Facettenknicke der starren Fläche oder die Formulierung"
    outcome: "SMOOTH 0 bricht in Abaqus 2025 vor dem ersten Inkrement ab (Normalenvektor null, Segmentation Fault); SMOOTH 0,2 läuft"
    machine: "Vollversion"
    findings: [FE-14]
  pilot_20layers_smooth0p01:
    purpose: "Knoten-zu-Fläche mit der kleinsten lauffähigen Glättung SMOOTH 0,01 (Vorlage)"
    outcome: "Vorlage; gerechnet in pilot_20layers_smooth0p01_gerechnet"
    machine: "-"
  pilot_20layers_smooth0p01_gerechnet:
    purpose: "SMOOTH 0,01: trennt Facettenknicke von der Fläche-zu-Fläche-Formulierung"
    outcome: "läuft alle Schritte, Ergebnisse gleich SMOOTH 0,2 innerhalb 0,1 %: die Facettenknicke sind nicht die Ursache, die Formulierung ist es"
    machine: "Vollversion"
    findings: [FE-14]
  frozen_mesh_20layers_bore33:
    purpose: "Eingefrorenes Netz des Ringkörpers (20 Schichten, Bohrung 33 mm) für das CONVERSE-Mapping; Stellung C, W1"
    outcome: "Mapping des Nutzers erzeugt (91_Converse/wheel_mesh_QS/DY1/DY2.cof); der Ringkörper-Pilot an C auf diesem Netz ist noch nicht gerechnet (Vergleich zum Taschenkörper)"
    machine: "-"
  frozen_mesh_20layers_bore33_pocket:
    purpose: "Eingefrorenes Netz des Taschenkörpers nach Zeichnung (Nabe, Steg, Taschen); Stellung C, W1 (Vorlage)"
    outcome: "Mapping des Nutzers erzeugt (91_Converse/wheel-pocket_mesh_QS/DY1/DY2.cof); gerechnet in frozen_mesh_20layers_bore33_pocket_gerechnet"
    machine: "-"
  frozen_mesh_20layers_bore33_pocket_gerechnet:
    purpose: "Taschenkörper an C, W1, linear, C3D8I, Knoten-zu-Fläche: erster Lauf des Radkörpers nach Zeichnung"
    outcome: "215 s, alle Schritte, keine negativen Eigenwerte; Stützmoment −1,2 bis −1,0 % (Δψ, FE-15), Kopfverschiebung 77,5 / 95,9 / 114,2 µm; Vergleich zum Ringkörper mit derselben Bohrung steht aus"
    machine: "Vollversion"
    findings: [FE-15, FE-18]
  study_20layers_bore33_60perpitch:
    purpose: "Auflösungsstudie der Stellungen: 133 Stellungen, 60 je Teilung, W1, 20 Schichten; Teilgitter 60/30/20/15/12/10"
    outcome: "läuft auf der Vollversion seit 2026-10-07 (etwa 6,5 h); liefert die Stellungen je Teilung und den Rand des Batches"
    machine: "Vollversion"
    status: "läuft"
  pinion_surface_7teeth_80layers:
    purpose: "Starre Ritzelfläche, 7 Zähne, 80 Schichten (Netzdatei, kein Lauf)"
    outcome: "Netzdatei"
    machine: "-"
  wheel_5teeth_12rings_80layers:
    purpose: "Erstes Radnetz aus der Referenztopologie, 5 Zähne, 12 Ringe, 80 Schichten (Netzdatei, kein Lauf)"
    outcome: "Netzdatei"
    machine: "-"
  le_tests/orientation:
    purpose: "Funktionstest: eine über eine Distribution definierte Orientierung dreht mit der Instanz"
    outcome: "Verhältnis B/A 1,000: die Orientierung dreht mit"
    machine: "Learning Edition"
  le_tests/pair_coarse:
    purpose: "Grobes Paar (1 Zahn, 2 Schichten) mit der vollständigen Struktur der Stellungsdatei"
    outcome: "SEAT, 8, 12, 16 Nm durch; Stützmoment −7933 / −11881 / −15788 N mm"
    machine: "Learning Edition"
  le_tests/pair_coarse_pocket:
    purpose: "Dasselbe grobe Paar auf dem Taschenkörper (je ein Ring Nabe/Tasche/Felge, 4 Schichten)"
    outcome: "alle Schritte durch, keine Warnung zum beschnittenen Netz; Stützmoment −7890 / −11830 / −15773 N mm"
    machine: "Learning Edition"
    findings: [FE-18]
  le_tests/pair_coarse_w3:
    purpose: "W3 mit synthetischer Orientierungsdatei (+x im Part, Feldvariablen 0,6/0,1): dreht die Faserorientierung mit der Instanz, stimmen die Feldvariablen"
    outcome: "108 Stichprobenelemente, Instanz +91,53° gedreht, Abweichung 0,0000°, Feldvariablen auf 3,6e-8: ja"
