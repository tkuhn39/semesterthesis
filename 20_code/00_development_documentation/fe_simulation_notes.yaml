  series_20layers_bore33_round0p1f12_30perpitch_margin1_qs_gerechnet:
    purpose: "Die Wochenendserie, gerechnet auf der Vollversion (2026-10-09 17:45 bis 2026-10-11 22:26, 50,0 h; W1 3,8, W2 5,0, W3 8,7, W4 12,6 min je Stellung im Mittel; 140 GB mit ODBs, am 2026-10-12 lokal eingetroffen); Felder und Spannungstensoren mit dem neuen extract_odb.py nachgezogen (Learning-Edition-Python, 2026-10-12), Auswertung mit `build_fe_decks.py report` und `fe_series_analysis.py` (Ordner analyse/) sowie `fe_fatigue.py stommel` je Serie"
    outcome: "395 von 396 Jobs vollständig; pos_073_W1_QS bricht bei 16 Nm (Schrittzeit 0,931, Stellung 3,84 mm ab A, 0,43 mm hinter E) mit dem Muster FE-19 ab (flatternde Flankenknoten 29294, 25369, 52844 bei r 25,80 mm, z −3,0 bis +2,25 mm), die Rundung 0,1 mm senkt die Abbruchrate von 11/133 (scharf, W1) auf 1/396. Verlängerter Eingriff des mittleren Zahns: 0,47 bis 0,60 Teilungen vor A, 0,35 bis 0,48 Teilungen hinter E (mit Moment und Plastizität wachsend), der Rand 1,0 Teilung reicht (FE-21 geschlossen). Werkstoffstufen bei 16 Nm gegen W1: Anisotropie W1 → W3 hebt σ1 am Fuß um 18 % und |σ3| um 14 % bei 3 % mehr Drehung; Plastizität W1 → W2 senkt σ1 um 39 %, |σ3| um 43 % und den Kantendruck um 46 % bei 17 % mehr Drehung (Fließkurve 80 °C beginnt bei 4,3 MPa); W3 → W4 entsprechend −33 / −35 / −46 % bei +13 %; W4 gegen W2 (Anisotropie plastisch) +28 / +29 % Fußspannung bei gleicher Drehung. Scharf (Studie) gegen gerundet (Serie, W1) an 68 gemeinsamen Stellungen: Unterschiede nur im Fenster von rund 0,3 mm um B und E, wo die Ritzelkopfkante trägt (Drehung +5 bis +7 %, Kantendruck −8 bis −11 %, σ1 −5 bis −9 %), an A, C, D und bei den Maxima innerhalb 2,5 % (Kraft des Nebenzahns +4 bis +5 %); die früher berichteten 6 bis 13 % waren die Stellungen 2 und 3 in diesem Fenster. Auflösung: 15 je Teilung ändert die Maxima um höchstens 2,9 % (W3, 16 Nm) und versetzt sie um höchstens 0,21 mm, 10 je Teilung bis 5,5 %, 6 je Teilung bis 15 %; die Wahl 30 je Teilung hält jedes Maximum innerhalb 1 %. Bemessung nach Stommel je Serie (99 Stellungen, Überlastungsfall F2, synthetische Wöhlerlinie, Fußrundungen des mittleren Zahns T3; Ordner stommel_<Serie>, stommel_hill_<Serie>): W1 wie veröffentlicht a_B,V 1,63 / 2,03 / 4,47 bei 8 / 12 / 16 Nm (N 3,9e3 / 0 / 0), W2 1,24 / 1,47 / 1,74 (N 3,5e5 / 2,2e4 / 1,7e3; a_stat 0,48 bis 0,73, statisch frei), W3 mit Hill 3,1 / 3,9 / 10,4 (a_stat ∞), W4 mit Hill 2,16 / 2,58 / 3,03 (a_stat 0,44 bis 0,73), W1 mit Hill 3,1 / 4,0 / 16,6. Kritischer Knoten in der Fußrundung T3_T4 (Druckseite, R < 0 durch den Nachbarzahn), bei W1 und W2 nahe der Stirnfläche (z −6,0 bis −6,75), bei W4 bei z −3,0 (Faserorientierung); die globalen Maxima liegen an Kopfknoten des Kantenkontakts (r 25,80) und unter Hill in der ersten Knotenreihe unter dieser Spur (r 25,78, in keinem Knotensatz, daher in den Tabellen mit dem Restlabel „rim“ bezeichnet, nicht die Fesselung, deren Satz am Fußkreis r 24,76 endet; geprüft 2026-10-13 an den Knotenkoordinaten), deshalb die Fußrundungen (FE-22). Der kritische Fußknoten sitzt 0,015 mm über dem Fußkreis am Übergang zur Fußfläche (r 24,775 der Zone 24,76 bis 25,08). Gegen den Laufversuch (8 Nm: Totalausfall bei 24 Mio., zweiter Lauf über 40 Mio.) unterschätzt die synthetische Linie mit W2 um rund 70×, W1 und Hill um Größenordnungen; E8 (Kalibrierung am kritischen Knoten mit der gemessenen Wöhlerlinie) ist der nächste Schritt"
    machine: "Vollversion"
    findings: [FE-15, FE-17, FE-19, FE-21]
