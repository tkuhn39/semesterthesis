  pilot_20layers_bore33_w2w4_qs_gerechnet:
    purpose: "Erster Lauf des nichtlinearen Piloten (W2 und W4, Rate QS, NLGEOM=YES, C3D8), vom Nutzer nach pos_031_W4 gestoppt (2026-10-09)"
    outcome: "W2 bricht in 11 s im Präprozessor ab: 'Anisotropic material properties without a local orientation system have been defined for 72320 elements' (der Hill-Potential-Block der isotropen Zeile braucht eine lokale Orientierung, Materialhandbuch Hill anisotropic yield; behoben: *ORIENTATION WHEEL_ISO = Teilerahmen am Solid Section von W2, die Fließverhältnisse der isotropen Zeile sind in den drei Normal- und drei Schubrichtungen gleich, der Rahmen ist also belanglos). W4 pos_001 (Rand −0,5 Teilung) läuft durch: 565 s (2,9 × W1), 6 Inkremente je Schritt, keine negativen Eigenwerte, Orientierungsprüfung an SEAT 0,002°, unter Last bis 0,59° Mitdrehung mit der Verformung (NLGEOM). Gegen W1 (Studie pos_001) bei 16 Nm: Ritzeldrehung 88,6 statt 77,5 µm (+14 %), Kopfverschiebung 100,2 statt 93,0 µm (+8 %), einlaufender Zahn T3 (1,48 mm vor A) trägt 67,8 statt 34,5 N, auslaufender T5 194,8 statt 199,2 N, Kantendruck 96,0 statt 125,5 MPa (−24 %), σ1 am Fuß T3_T4 61,7 statt 77,1 MPa (−20 %, Maximum bei z +4,5 statt −3,75 durch die Faserorientierung), |σ3| T4_T5 68,0 statt 89,8 MPa. Am Gitterrand tragen die Randzähne noch 10 bzw. 30 % der Zahnkraft: der Rand von 0,5 Teilung reicht für W4 nicht, Randpilot pilot_20layers_bore33_w4_qs_margin geschrieben"
    machine: "Vollversion"
    findings: [FE-15, FE-17]
  pilot_20layers_bore33_w4_qs_margin:
    purpose: "Randpilot W4 QS: Stellungen bei −1,0 und −0,75 Teilung vor A und +0,75 und +1,0 Teilung hinter E (Gitter 60 je Teilung mit Rand 1,0 Teilung, Indizes 1, 16, 178, 193), um den Beginn und das Ende des verlängerten Eingriffs der nachgiebigsten Stufe zu finden und daraus den Rand des Batches (Vorlage, 2026-10-09)"
    outcome: "Vorlage"
    machine: "-"
  study_20layers_bore33_60perpitch_retry_iter100:
    purpose: "Dritte Abhilfe gegen das Flattern an der Ritzelkopfkante, ohne Änderung von Geometrie und Kontaktbedingung: Iterationsgrenzen je Inkrement I_0/I_R/I_C = 20/30/100 statt 4/8/16 (*CONTROLS, PARAMETERS=TIME INCREMENTATION), damit die langsam konvergierende Kontaktiteration (Faktor 0,85 bis 0,95 je Iteration in den .msg der Abbrüche) zu Ende läuft statt in den Rückschnitt; Stellungen 2 (Kontrolle), 3, 44, 45 der Studie (Abbrüche bei 16, 12 und 8 Nm), scharfe Kante, Lagrange (Vorlage, 2026-10-09)"
    outcome: "Vorlage; Netz, Fläche und Decks identisch mit der Studie bis auf die vier *CONTROLS-Zeilen"
    machine: "-"
  study_20layers_bore33_60perpitch_retry_round0p05:
    purpose: "Dieselben 14 Stellungen mit der Kopfkante des starren Ritzels auf 0,05 mm gerundet (Entgratung als Modellannahme der starren Fläche, mindestens vier Facetten je Bogen), Kontaktdurchsetzung wie in der Studie (Vorlage, 2026-10-09)"
    outcome: "Vorlage; Radnetz und Decks identisch mit der Studie, nur pinion_surface.inp hat 932 statt 897 Profilknoten; gerechnet in study_20layers_bore33_60perpitch_retry_round0p05_gerechnet (nach pos_003 abgebrochen)"
    machine: "-"
  study_20layers_bore33_60perpitch_retry_round0p05_gerechnet:
    purpose: "Kopfkante des starren Ritzels auf 0,05 mm gerundet (fünf Facetten je Bogen, 0,014 mm) gegen das Flattern: Kontrolle pos_002 und die abgebrochene pos_003, vom Nutzer nach pos_003 gestoppt (2026-10-09)"
    outcome: "Verschiebt das Problem, löst es nicht: die in der Studie durchgelaufene Kontrolle pos_002 bricht jetzt bei 12 Nm ab (Schrittzeit 0,752, 8 min, dieselben Knoten 7293/77943 der rechten Flanke T5, r 25,901, z ±6,75), pos_003 läuft durch (252 s, 8 Inkremente mit zwei Rückschnitten bei 12 Nm). Die Rundung von 0,05 mm ist kleiner als der Reihenabstand der Flankenknoten (0,1 mm): die Kante trifft die Knotenreihe nur 0,05 mm früher auf der Bahn. Befund aus den .msg aller drei Abbrüche (Studie pos_045, Penalty pos_003, Rundung pos_002): der Penetrationsfehler des flatternden Knotens nimmt in der letzten Attempt monoton oder mit abklingender Oszillation ab (Faktor 0,85 bis 0,95 je Iteration), die Lösung konvergiert also, nur zu langsam für die 16 Gleichgewichtsiterationen (I_C) je Inkrement; der Rückschnitt verkleinert dann das Verschiebungsinkrement und damit die Penetrationstoleranz weiter. Abhilfe zu prüfen: höhere Iterationsgrenzen (*CONTROLS, PARAMETERS=TIME INCREMENTATION, I_0/I_R/I_C) ohne Änderung von Geometrie und Kontaktbedingung. pos_044 wurde bei 16 Nm gestoppt (kein Ergebnis)"
    machine: "Vollversion"
    findings: [FE-14, FE-17]
