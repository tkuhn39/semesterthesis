# Curated notes of the simulation diary (fe_simulation_log.md, generated by
# `build_fe_decks.py log`): one entry per output folder below 80_output/fe/<case>, keyed by the
# folder name relative to the case. The generator adds status, settings and key results from
# the files; this file holds what the files cannot say: the purpose of the run, the outcome in
# one sentence, the findings it belongs to (known_limits.md) and where it ran. Folders without
# an entry appear in the diary with "(keine Notiz)". Dates are those of the runs.
