  frozen_mesh_20layers_bore33_gerechnet:
    purpose: "Ringkörper an C, Bohrung 33, W1 linear C3D8I, Knoten-zu-Fläche: Referenz für den Taschenkörper mit derselben Bohrung und Reproduzierbarkeitsprobe gegen Stellung 66 der Studie (gleiches Netz, gleiches Deck bis auf CFORCE im Feldrequest)"
    outcome: "177 s, alle Schritte; auf alle ausgegebenen Stellen gleich Stellung 66 der Studie (RM3 −7910,43/−11835,99/−15800,93 N mm, Drehung 56,0/71,0/84,0 µm, CPRESS 59,09/67,68/74,80 MPa, σ1 max T2_T3 56,10/70,45/82,91 MPa, Kopf 66,9/84,5/99,8 µm). Taschenkörper gegen Ring (8/12/16 Nm): Ritzeldrehung +15,4/+13,1/+14,3 %, Kopfverschiebung +15,8/+13,5/+14,4 %, σ1 max T2_T3 +5,9/+3,2/+3,8 %, |σ3| max T3_T4 +10,4/+6,0/+6,5 %, CPRESS der Hauptkontaktzahn T3 +4,0/+2,0/+2,3 %; der Taschenkörper verlagert das Druckmaximum von z ±6,75 (Randschicht) auf z = 0 (Mitte, über dem Steg) und gibt bei 16 Nm dem Kantenkontakt des auslaufenden Zahns T4 121,5 statt 88,4 N (CPRESS 80,1 statt 56,3 MPa)"
