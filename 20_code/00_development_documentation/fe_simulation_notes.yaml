  study_20layers_bore33_60perpitch_retry_iter100_gerechnet:
    purpose: "Iterationsgrenzen I_0/I_R/I_C = 20/30/100: Kontrolle pos_002 und die abgebrochene pos_003, vom Nutzer nach pos_003 gestoppt (2026-10-09)"
    outcome: "Hilft nur teilweise: die Inkremente 8 bis 10 des 16-Nm-Schritts, die mit 16 Iterationen zurückgeschnitten wurden, konvergieren jetzt nach 50, 51 und 40 Iterationen; Inkrement 13 (Schrittzeit 0,206, 12,8 Nm, dieselbe Stelle wie in der Studie) divergiert aber: der Penetrationsfehler des Knotens 7293 (rechte Flanke T5, r 25,901, z −6,75) wechselt je Iteration das Vorzeichen und wächst um 4 % je Iteration (2,5e-8 → 5,6e-8 mm in 20 Iterationen), bei Inkrementgrößen 1e-5 bis 1e-6 gleich; Abaqus meldet 'THE SOLUTION APPEARS TO BE DIVERGING', 20 min, 1 322 s. Also eine echte Instabilität der Newton-Iteration des harten Knoten-zu-Fläche-Kontakts an der facettierten Kopfkante, kein Iterationsbudget. Kontrolle pos_002 (186 s) ziffernidentisch mit der Studie, wie erwartet. Nächste physikneutrale Hebel: Line Search N_ls = 5 (dämpft oszillierende Newton-Korrekturen) und der Versatz der Stellung um 0,01 mm; darüber hinaus nur mit Eingriff in Kontaktgesetz (weiches Kontaktgesetz) oder Geometrie (Rundung größer als der Knotenreihenabstand 0,1 mm)"
    machine: "Vollversion"
    findings: [FE-14, FE-19]
  study_20layers_bore33_60perpitch_retry_ls5_iter100:
    purpose: "Vierte Abhilfe: Line Search N_ls = 5 (*CONTROLS, PARAMETERS=LINE SEARCH) zusammen mit den Iterationsgrenzen 20/30/100, gegen die mit 4 % je Iteration wachsende Oszillation des Flankenknotens an der Ritzelkopfkante (iter100-Lauf); Stellungen 2 (Kontrolle), 3, 44, 45, scharfe Kante, Lagrange (Vorlage, 2026-10-09)"
    outcome: "Vorlage; Decks identisch mit der Studie bis auf die CONTROLS-Zeilen je Schritt; gerechnet in study_20layers_bore33_60perpitch_retry_ls5_iter100_gerechnet (nach pos_003 abgebrochen)"
    machine: "-"
  study_20layers_bore33_60perpitch_retry_ls5_iter100_gerechnet:
    purpose: "Line Search N_ls = 5 mit den Iterationsgrenzen 20/30/100: Kontrolle pos_002 und die abgebrochene pos_003, vom Nutzer nach pos_003 gestoppt (2026-10-09)"
    outcome: "Hilft nicht: pos_003 bricht exakt wie im iter100-Lauf ab (gleiche Inkremente, gleiche Iterationszahlen, Schrittzeit 0,206, 23 min); der Line Search greift in den letzten Attempts gar nicht (18 zusätzliche Residuenauswertungen im ganzen Lauf, keine in den divergierenden Iterationen), die Oszillation des Knotens 7293 wächst unverändert um 4 % je Iteration. Damit sind die löserseitigen, physikneutralen Hebel erschöpft (Penalty, Iterationsgrenzen, Line Search); die Abbruchstellen der Studie liegen paarweise nebeneinander (044/045, 055/056, 106/107, 117/118), das instabile Fenster ist also 0,05 bis 0,1 mm breit auf dem Wälzweg. Nächste Versuche: Versatz der Stellung um 0,025 mm (halber Schritt des 60er-Gitters, die Nachbarn 002 und 004 liefen) und, als Geometrieoption, Rundung 0,1 mm mit 12 Facetten je Bogen"
    machine: "Vollversion"
    findings: [FE-14, FE-19]
  study_20layers_bore33_60perpitch_retry_shift0p025_iter100:
    purpose: "Fünfte Abhilfe, ohne Änderung von Modell oder Löser: die Stellungen 2 (Kontrolle), 3, 44, 45 um 0,025 mm auf dem Wälzweg versetzt (halber Schritt des 60er-Gitters; die Nachbarn der Abbrüche liefen durch), mit den Iterationsgrenzen 20/30/100; die Dateien behalten ihre Nummern, das Manifest trägt den Versatz und den verschobenen Wälzweg (Vorlage, 2026-10-09)"
    outcome: "Vorlage; gerechnet in study_20layers_bore33_60perpitch_retry_shift0p025_iter100_gerechnet"
    machine: "-"
  study_20layers_bore33_60perpitch_retry_shift0p025_iter100_gerechnet:
    purpose: "Stellungen 2, 3, 44, 45 um 0,025 mm versetzt, Iterationsgrenzen 20/30/100 (2026-10-09, 16:16 bis 16:33)"
    outcome: "Alle vier 'COMPLETED', aber nur die Kontrolle pos_002 ist brauchbar (gegen die unversetzte Stellung: Drehung, Fußspannung, Kopfverschiebung innerhalb 0,5 bis 1 %, Kantendruck −4 bis −5 %, wie die Steigung der Kurven dort erwartet). pos_003 und pos_044 landen auf dem anderen Lösungsast des Knoten-zu-Fläche-Kontakts an der scharfen Kante: die Kontaktkraft ist um 8,9 / 5,5 / 3,6 ° (pos_003) und 12,9 / 8,3 / 5,8 ° (pos_044) gegen die Eingriffslinie gedreht, a_1/r_b1 nur 0,86 bis 0,97, das Stützmoment 3,2 bis 5,1 % über z_2/z_1·T_1, Summe der Zahnkräfte über der Zahnkraft: die Kantenknoten des auslaufenden Zahns liegen auf der Kopffacette der starren Fläche statt auf der Flankenfacette, die Kraft zeigt radial zum Ritzel statt entlang der Eingriffslinie. pos_045 verliert im 8-Nm-Schritt den Kontakt vollständig (0 geschlossene Knoten, RM3 = 0, Ritzel um 8,9 mrad verdreht), der Lauf 'konvergiert' mit leerem Kontakt. Der Versatz ist damit keine Rückfallebene: die Instabilität ist die Mehrdeutigkeit der Masternormalen an der scharfen Kante (Normalenkegel zwischen Flanken- und Kopffacette), und welchen Ast der Löser trifft, ist Zufall. Konsistent sind nur die Lösungen auf dem Flankenast (Kraft innerhalb 0,1 bis 3 ° der Eingriffslinie, Stützmoment innerhalb 1 %), wie in allen 122 durchgelaufenen Stellungen der Studie; die gerundete Kante (retry_round0p1_f12) hat eine stetige Normale und damit genau einen Ast"
    machine: "Vollversion"
    findings: [FE-15, FE-17, FE-19]
