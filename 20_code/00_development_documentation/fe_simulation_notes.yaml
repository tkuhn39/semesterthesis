  study_20layers_bore33_60perpitch_retry_round0p1_f12_iter100_gerechnet:
    purpose: "Rundung 0,1 mm mit 12 Facetten je Bogen plus Iterationsgrenzen an den Stellungen 2, 3, 44, 45 (2026-10-09, 15:58 bis 16:13)"
    outcome: "Numerisch die erste Variante, die alle vier Stellungen durchbringt: je 6 Inkremente je Schritt ohne Rückschnitt, 0 negative Eigenwerte, 197 bis 219 s. Physikalisch aber keine kleine Änderung: gegen die scharfe Kante (Studie) bei pos_002 Ritzeldrehung +9,7 / +7,9 / +6,8 % bei 8 / 12 / 16 Nm, Kopfverschiebung +10 / +8 / +7 %, σ1 am Fuß +10 / +7 / +6 %, |σ3| +12 / +10 / +8 %; die Kraft des auslaufenden Zahns T5 am Kantenkontakt −42 / −18 / −9 %, die des Hauptzahns T4 +12 / +9 / +8 %, der Kantendruck bei 16 Nm 116,5 → 72,1 MPa (das Maximum liegt dann am Hauptkontakt). pos_003 bei 8 Nm: Drehung +12 %, σ1 +13 %, T5 trägt gar nicht mehr. Die Rundung verkürzt also den verlängerten Eingriff am Ritzelkopf, verlagert Last vom auslaufenden auf den Hauptzahn und hebt Drehung und Fußspannung um 6 bis 13 % (an diesen Stellungen; über den ganzen Eingriff liegen die Maxima innerhalb 2,5 %, die Unterschiede bleiben im Fenster von 0,3 mm um B und E, Wochenendserie 2026-10-12): eine Modelländerung, kein numerischer Eingriff. Befund für die Arbeit: Drehung und Fußspannung des Kunststoffrads hängen mit rund 10 % je 0,1 mm am Kantenradius des Stahlritzels; der wirkliche Radius der Ritzelkante (Mikroskop) ist damit ein Eingangsparameter, nicht eine Numerikfrage"
    machine: "Vollversion"
    findings: [FE-17, FE-19]
  series_20layers_bore33_round0p1f12_30perpitch_margin1_qs:
    purpose: "Wochenendserie (Nutzer 2026-10-09, ein Ordner für einen unbeaufsichtigten Lauf von rund 60 h): Ringkörper Bohrung 33, Kopfkante des starren Ritzels 0,1 mm mit 12 Facetten je Bogen (kleinste Kante, die das Netz ohne Instabilität verträgt, FE-19; die gemessene Kante kommt nächste Woche), 30 Stellungen je Teilung von 1,0 Teilung vor A bis 1,0 Teilung hinter E (99 Stellungen; der Rand zeigt selbst, wo die Randzähne kraftfrei werden, FE-21), alle vier Werkstoffstufen W1 bis W4 bei Rate QS, Iterationsgrenzen 20/30/100; 396 Dateien, erwartet rund 22 min je Stellung (W1/W2/W3 je 4 min, W4 10 min), 38 h plus Extraktion, ODBs rund 120 GB"
