  study_20layers_bore33_60perpitch:
    purpose: "Auflösungsstudie der Stellungen: 133 Stellungen, 60 je Teilung, W1, 20 Schichten; Teilgitter 60/30/20/15/12/10 (Vorlage)"
    outcome: "Vorlage; gerechnet in study_20layers_bore33_60perpitch_gerechnet"
    machine: "-"
  study_20layers_bore33_60perpitch_gerechnet:
    purpose: "Auflösungsstudie der Stellungen auf der Vollversion (2026-10-07, 12:46 bis 23:07): wie viele Stellungen je Teilung, damit Ort und Wert der Maxima über dem Eingriffsweg trotz Zahnbiegung (verlängerter Eingriff) nicht am Gitter hängen"
    outcome: "122 von 133 durch (181 bis 415 s, Mittel 229 s), 11 abgebrochen (409 bis 819 s). Verlängerter Eingriff: bei 16 Nm setzt der nächste Zahn 1,65 mm vor A auf, der scharfe Ritzelkopf bleibt 1,5 mm hinter E auf dem auslaufenden Zahn, kein Einzeleingriff mehr (an C 89/477/88 N); Fußspannungsmaximum des Rads bei C (1,62 bis 1,64 mm ab A), nicht bei B. Teilgitter gegen 60 je Teilung bei 16 Nm (Drehung, CPRESS, σ1, |σ3|, Kopfverschiebung): 30 je Teilung Ort innerhalb 0,02 mm und Wert innerhalb 0,15 %; 20 je Teilung 0,05 mm und 1,6 % (|σ3|, Spitze); 15 je Teilung 0,1 mm und 2,1 %; 12 je Teilung 0,3 % (Lage); 10 je Teilung 2,5 %. Bei 8 Nm sind die Maxima Spitzen an den Übergängen der Paarzahl, dort 30 je Teilung bis 1,7 %, 20 je Teilung trifft die Spitzen des 60er-Gitters. Empfehlung 20 je Teilung plus A bis E (47 Stellungen über −0,5 bis +0,5 Teilung). Die 11 Abbrüche liegen periodisch an drei Bahnorten je Teilung (0,59 bis 0,64, 1,13 bis 1,18 und 1,57 mm ab A der Paare −1, 0, +1): die scharfe Kopfkante des Ritzels sitzt dann auf einer Knotenreihe der Flanke des auslaufenden Zahns (r 25,698/25,800/25,901 mm, Randschichten z ±6,75 und ±7,5) hinter E; der Knoten auf dem Knick der Masterfläche flattert (Penetrationsfehler, 16 Iterationen, Rückschnitt bis 1e-6), die negativen Eigenwerte dieser 11 Läufe sind Begleiterscheinung (0 in den 122 durchgelaufenen). Sektorrand: Lastaufteilung und Fußspannung der Nachbarzähne T2/T4 weichen 1 bis 2 % von T3 ab (feste Schnittflächen); Auswertung am mittleren Zahn T3"
    machine: "Vollversion"
    findings: [FE-14, FE-15, FE-16, FE-17]
  study_20layers_bore33_60perpitch_retry_penalty:
    purpose: "Wiederholung der 11 abgebrochenen Stellungen der Studie (3, 44, 45, 55, 56, 64, 106, 107, 117, 118, 126) plus drei durchgelaufene Kontrollen (2, 46, 66 = C) mit Penalty-Durchsetzung der harten Kontaktbedingung (PENALTY=LINEAR statt direkter Lagrange-Multiplikatoren), sonst identisch (Vorlage, 2026-10-09)"
    outcome: "Vorlage; Netz und Stellungen byteidentisch mit der Studie, nur die Zeile *SURFACE BEHAVIOR unterscheidet sich; gerechnet in study_20layers_bore33_60perpitch_retry_penalty_gerechnet (nach pos_003 abgebrochen)"
    machine: "-"
  study_20layers_bore33_60perpitch_retry_penalty_gerechnet:
    purpose: "Penalty-Durchsetzung (PENALTY=LINEAR) gegen das Flattern der Kopfkante: Kontrolle pos_002 und die abgebrochene pos_003, vom Nutzer nach pos_003 gestoppt (2026-10-09)"
    outcome: "Hilft nicht: pos_003 bricht wieder bei 16 Nm ab (Schrittzeit 0,160 statt 0,206, 10 min, 125 Warnungen negativer Eigenwerte) an denselben Knoten 7293/77943 (T5 rechte Flanke, r 25,901, z ±6,75), die Art der Kontaktbedingung ist nicht die Ursache, der Knick der Masterfläche ist es. Nachgiebigkeit der Penalty an der Kontrolle pos_002 gegen die Studie: Stützmoment innerhalb 0,03 %, Ritzeldrehung +0,4 % (50,7/65,0/77,2 gegen 50,5/64,7/76,9 µm), CPRESS am Hauptkontakt −2,4/−1,8/−1,8 %, am Kantenkontakt −0,9 %, Normalkräfte je Zahn innerhalb 0,5 N, σ1 am Fuß +0,1 %, Kopfverschiebung +0,2 %. pos_044 wurde im Schritt SEAT abgebrochen (kein Ergebnis); die path_*-Dateien des Ordners sind mit drei Stellungen ohne Aussage"
    machine: "Vollversion"
    findings: [FE-14, FE-17]
  pilot_20layers_bore33_w2w4_qs:
    purpose: "Pilot der nichtlinearen Werkstoffstufen W2 (isotrop elastisch-plastisch) und W4 (Orientierungsdatei mit Plastizität), Rate QS als nachgiebigster Fall, NLGEOM=YES, C3D8, Ringkörper Bohrung 33: fünf Stellungen des 60er-Gitters (Rand −0,5 Teilung, A, C, E, Rand +0,5 Teilung), um die Verformung und die Eingriffsverlängerung gegen W1 zu messen, bevor Schrittweite und Rand des Batches festgelegt werden (Nutzer 2026-10-09: 20 je Teilung reicht für W1, für die nichtlinearen Stufen offen; Vorlage)"
    outcome: "Vorlage; Kontaktdurchsetzung wie in der Studie (Voreinstellung), bis die Wiederholungsläufe die Abhilfe gegen das Flattern entschieden haben. Erster Lauf in pilot_20layers_bore33_w2w4_qs_gerechnet: W2 vom Präprozessor abgewiesen; Ordner am 2026-10-09 mit der Orientierung für W2 neu geschrieben (W4-Decks bis auf die Kopfzeile unverändert)"
