  le_tests/grid_1tooth_8perpitch:
    purpose: "Stellungsgitter 8 je Teilung auf dem groben Einzahnmodell: Test der Auswertung über dem Eingriffsweg"
    outcome: "17 Stellungen durch; Kurven und Auflösungstabelle geprüft"
    machine: "Learning Edition"
  le_tests/element_nlgeom/c3d8i:
    purpose: "Elementtest: C3D8I mit NLGEOM=YES und NO"
    outcome: "NLGEOM=YES: 29 Warnungen negativer Eigenwerte ab 8 Nm Inkrement 1"
