# STplus oracle cases (ADR-102). `import` = supplied pair parsed as-is; `run` = executed with the local
# STplus 11.1F installation (Windows only). trust: verified | unverified | generated.
# Supplied pairs: user statement 2026-09-28 — kst-E and kst-B are definitely correct, kst-A and kst-C
# are unconfirmed. Every supplied pair is additionally re-run with 11.1F (…_rerun) to expose input
# errors or version drift before it counts as a reference.
cases:
  # ---- supplied reference pairs (FZG Kleinverspannungsprüfstand gear sets) --------------------
  - name: kst_e
    mode: import
    ste: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-E_eingabe.ste
    sta: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-E-ausgabe.sta
    trust: verified
    material_kinds: {16MnCr5: steel, WST_PA66: plastic}
    notes: "z 51/52, m_n 1, a 52; steel pinion / PA66 wheel; STplus 11.0F listing dated 14.02.25"
  - name: kst_b
    mode: import
    ste: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-B_eingabe.ste
    sta: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-B_ausgabe.sta
    trust: verified
    material_kinds: {16MnCr5: steel}
    notes: "z 36/54, m_n 2, a 91.5; DIN 3967 series C25; x from span measurement; STplus 9.0F"
  - name: kst_a
    mode: import
    ste: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-A_eingabe.ste
    sta: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-A_ausgabe.sta
    trust: unverified
    notes: "z 72/108, m_n 1, a 91.5; geometry only; user: not confirmed"
  - name: kst_c
    mode: import
    ste: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-C_eingabe.ste
    sta: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-C_ausgabe.sta
    trust: unverified
    notes: "z 24/36, m_n 3, a 91.5; h_aP0* 1.3 pinion; user: not confirmed"
  # ---- re-runs of the supplied inputs with the installed 11.1F ------------------------------
  - name: kst_e_rerun
    mode: run
    ste: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-E_eingabe.ste
    trust: generated
    material_kinds: {16MnCr5: steel, WST_PA66: plastic}
    notes: "kst-E input re-run with 11.1F incl. contour export"
  - name: kst_b_rerun
    mode: run
    ste: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-B_eingabe.ste
    trust: generated
    material_kinds: {16MnCr5: steel}
    notes: "kst-B input re-run with 11.1F (supplied listing is 9.0F)"
  - name: kst_a_rerun
    mode: run
    ste: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-A_eingabe.ste
    trust: generated
    notes: "kst-A re-run — compare against the unconfirmed supplied listing"
  - name: kst_c_rerun
    mode: run
    ste: 30_references_and_examples/33_STplus/weitere_Konfigurationen/kst-C_eingabe.ste
    trust: generated
    notes: "kst-C re-run — compare against the unconfirmed supplied listing"
  # ---- manual example with explicit rack tool -----------------------------------------------
  - name: fzg_c
    mode: run
    ste: 30_references_and_examples/33_STplus/STplus11-1F/work/eingabe.ste
    trust: generated
    material_kinds: {17CrNiMo6: steel}
    notes: "STplus default dataset: FZG-C z 16/24, m_n 4.5, a 91.5, spur, Fraes_WKZ h_aP0* 1.39 rho 0.25"
  # ---- generated adversarial variants (rack tools, explicit) ------------------------------------
  - name: helix20_z25_65
    mode: run
    trust: generated
    notes: "helical like manual example 1 but with explicit rack tools: beta 20, m_n 5, a 241"
    template:
      m_n: 5
      beta: 20
      a: 241
      pinion: {z: 25, x: 0.25, b: 50, tool: {h_aP0: 1.25, rho_aP0: 0.3}}
      wheel: {z: 65, b: 50, tool: {h_aP0: 1.25, rho_aP0: 0.3, alpha_K0: 45}}
  - name: helix30_z25_40
    mode: run
    trust: generated
    notes: "beta 30, both x given, a from sum"
    template:
      m_n: 3
      beta: 30
      pinion: {z: 25, x: 0.3, b: 30, tool: {h_aP0: 1.25, rho_aP0: 0.38}}
      wheel: {z: 40, x: -0.1, b: 30, tool: {h_aP0: 1.25, rho_aP0: 0.38}}
  - name: undercut_z12_x0
    mode: run
    trust: generated
    notes: "z 12 without profile shift → undercut branch (closed-form d_Ff invalid)"
    template:
      m_n: 2
      pinion: {z: 12, x: 0.0, b: 20, tool: {h_aP0: 1.25, rho_aP0: 0.25}}
      wheel: {z: 40, x: 0.0, b: 20, tool: {h_aP0: 1.25, rho_aP0: 0.25}}
  - name: small_z8_x05
    mode: run
    trust: generated
    notes: "z 8 with x 0.5, small module"
    template:
      m_n: 1
      pinion: {z: 8, x: 0.5, b: 10, tool: {h_aP0: 1.25, rho_aP0: 0.38}}
      wheel: {z: 30, x: 0.2, b: 10, tool: {h_aP0: 1.25, rho_aP0: 0.38}}
  - name: plastic_m05_z20
    mode: run
    trust: generated
    notes: "m_n 0.5 fine pitch as used for plastic gears (geometry only)"
    template:
      m_n: 0.5
      pinion: {z: 20, x: 0.1, b: 6, tool: {h_aP0: 1.25, rho_aP0: 0.2}}
      wheel: {z: 41, x: 0.05, b: 6, tool: {h_aP0: 1.25, rho_aP0: 0.2}}
  - name: neg_shift_z17_xm08
    mode: run
    trust: generated
    notes: "audit case P0-01: strongly negative x (legacy inverse involute diverged)"
    template:
      m_n: 4
      pinion: {z: 17, x: -0.8, b: 20, tool: {h_aP0: 1.25, rho_aP0: 0.25}}
      wheel: {z: 60, x: 0.6, b: 20, tool: {h_aP0: 1.25, rho_aP0: 0.25}}
  # ---- added by the gate of increment 2 (finding G2B-10) ----------------------------------------
  - name: chamfer_hk_z20_34
    mode: run
    trust: generated
    notes: "tip chamfer as an input (KOPFKANTENBRUCH > 0 on both gears): Eq. (127) against STplus"
    template:
      m_n: 2
      pinion: {z: 20, x: 0.2, b: 20, h_K: 0.2, tool: {h_aP0: 1.25, rho_aP0: 0.25}}
      wheel: {z: 34, x: 0.1, b: 20, h_K: 0.3, tool: {h_aP0: 1.25, rho_aP0: 0.25}}
  - name: helix15_b_unequal
    mode: run
    trust: generated
    notes: "helical pair with different face widths: contact face width and overlap ratio"
    template:
      m_n: 2.5
      beta: 15
      pinion: {z: 19, x: 0.3, b: 30, tool: {h_aP0: 1.25, rho_aP0: 0.3}}
      wheel: {z: 47, x: 0.0, b: 24, tool: {h_aP0: 1.25, rho_aP0: 0.3}}
  - name: a_x2_only_z18_45
    mode: run
    trust: generated
    notes: "centre distance and x_2 given, x_1 open: the rule of ADR-107 against STplus"
    template:
      m_n: 3
      a: 96
      pinion: {z: 18, b: 25, tool: {h_aP0: 1.25, rho_aP0: 0.25}}
      wheel: {z: 45, x: 0.1, b: 25, tool: {h_aP0: 1.25, rho_aP0: 0.25}}
