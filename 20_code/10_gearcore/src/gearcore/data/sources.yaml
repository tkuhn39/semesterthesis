# Verified source registry (ADR-103). Keys name the document AND its edition; @eq references use them.
# `verified` records how the identifier was checked (pdf-header / pdf-imprint / isbn-checksum /
# crossref / dpma); `confirmed_by_user: false` means the user has not yet checked the entry against
# the PDF. Entries with `status: missing` have no verifiable identifier yet and must not be cited
# from code. Titles are transcribed from the PDF headers; norm titles are abbreviated.
#
# Scope (user decision 2026-09-29): only sources that are currently needed are listed. Present in
# 00_literatur/05_normen_und_richtlinien but deliberately NOT registered yet: DIN 3990-6:1994-12
# (used by STplus for load spectra), DIN 3990-11:1989-02 and DIN 3990-21:1989-02 (application
# norms, reproducible in STplus via method choice; Annex B worked examples), DIN 3990-16:2020-05 and
# DIN 3990-17:2026-07 (lubricant test methods, not in STplus), ISO/TR 10064-1…-6, and the English
# second copies of DIN 3967, DIN 867, DIN 3972, DIN 3990-16. They are added when first needed.
