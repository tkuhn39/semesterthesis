    verified: { method: pdf-header, by: "claude/pdftotext", date: "2026-09-28" }
    confirmed_by_user: true
    notes: "Symbols of the norm itself (p. 1): h_kw = Kopfhöhe (indices k = 'bezogen auf Zahnkopf', w = 'bezogen auf Werkzeug'), Bezugsprofile I–IV: h_kw I = 1,167·m; h_kw II = 1,25·m; h_kw III = 1,25·m + 0,25·∛m; h_kw IV = 1,25·m + 0,6·∛m. h_fr = Fußhöhe (indices f = 'bezogen auf Zahnfuß', r = 'bezogen auf Zahnrad') (1,167·m for I, 1,25·m for II–IV); h_w = tooth depth of the tool (figure, no designation printed), Kleinstmaß ≥ 2,367·m (I) / ≥ 2,45·m (II–IV); p = Bearbeitungszugabe je Flanke (III: 0,25·∛m·sin α0; IV: 0,6·∛m·sin α0, p. 2). Rundungen: table column 'r_2 ≈ 0,2 m' is TABULATED, not a formula (0,08 at m=1; 0,12 at 1,25; 0,20 at 1,5; 0,25 at 1,75; 0,30 at 2; 0,40 at 2,25; from m=2,5 mostly 0,2·m, e.g. 0,50 at 2,5 and 2,75; 0,60 at 3 and 3,25); r_1 = Rundung am Zahnkopf des Werkzeugs 'wird gleich r_2 ausgeführt', except shaper cutters (edge only lightly broken). Mapping to current notation (DIN ISO 21771:2014-08 §7.1, Bild 35, symbol list §3.1): h_kw ≙ h_aP0 (Kopfhöhe des Werkzeug-Bezugsprofils), r_1 ≙ tool tip rounding radius (index aP0; STplus KOPFABRUNDUNGSFAKTOR rho_aP0*). The norm has no symbols h_aP0 or ρ — an earlier version of this note used the modern symbols without saying so (corrected 2026-09-29 after the user's check)."
