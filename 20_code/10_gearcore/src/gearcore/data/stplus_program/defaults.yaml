    manual: { page: 224, text: "Die max. Fußformhöhe kann über die min. Werkzeug-Lückenweite e_Ff0*, die max. Fußhöhe über die min. Werkzeug-Lückenweite e_f0* eingestellt werden. e_Ff0* ist mit 0,4, e_f0* mit 0,06 vorbelegt." }
