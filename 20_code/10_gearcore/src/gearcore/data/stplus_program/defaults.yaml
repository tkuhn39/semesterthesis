    value: 0.13
    unit: "-"
    rule: "smallest tip clearance c_min in modules; a given tip clearance factor c* is accepted below c_max = 0,75 (MAX_KOPFSPIEL); a remark is printed below 0,2 m_n (VERMERK_KOPFSPIEL)"
