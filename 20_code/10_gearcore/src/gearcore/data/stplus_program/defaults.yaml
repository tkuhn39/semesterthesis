    manual: { page: 226, text: "Das auf m_n bezogene Mindestkopfspiel c_min ist mit 0,13 vorbelegt. Der Einstellbereich ist 0,001 bis 0,99. Wurde bei den \"Geometriedaten\" der Kopfspielfaktor c* vorgegeben, wird dieser nur akzeptiert, wenn dieser kleiner als das auf m_n bezogene maximale Kopfspiel c_max (Vorbelegung = 0,75) ist. c_max kann zwischen 0,00001 und 1,0 variiert werden. Ein Vermerk für kleines Kopfspiel erfolgt, wenn das auf m_n bezogene Istkopfspiel kleiner als 0,2 ist. Der Wert kann zwischen 0,05 und 0,5 variiert werden." }
