    applies_to: "both"
    manual: null
    probe: "tool_edge_break_angle_eighty_five_degrees: 0.9 / 1.5 with KANTENBRECHWINKEL = 85 is run with h_fP0* 0.939, d_Fa 45.077, h_K 0.050, Restdicke 0.021; tool_edge_break_angle_eighty_eight_degrees: with 88 the run ends with 'Iteration IREG = 10 fuer Rad 1 nach 100 Schritten abgebrochen'"
    status: verified
    note: "The importer raises NotSupportedError for an angle above 85 and below 90 degrees (stplus_program.STPLUS_MAX_EDGE_BREAK_ANGLE_DEG); where STplus fails between 85 and 88 degrees is not known. gearcore's generation reproduces the 85 degree run (d_a, d_Fa, h_K in five decimals); its residual thickness is 0.02002 against 0.02051, 0,5 um apart. The cause is the single precision of STplus: DIN 3960 (A.3.05) subtracts two numbers of the size 11 there, and evaluated in binary32 the formula yields 0.01960 or 0.02051 mm, depending on the last bit of the tip diameter; gearcore's value is confirmed by the envelope of the rolling tool flank (tests/test_stplus_reading.py). The limit BOGENDIFFERENZ does not change the printed value (exploratory runs from 5000 to 40000). The generation itself computes flanks up to 89,9 degrees (generation.MAX_EDGE_BREAK_ANGLE_DEG)."
