# Defaults of STplus — what the program presets when an input is missing.
#
# User decision 2026-09-30 (ADR-109): the defaults of STplus are no norm values, but they are kept
# so that a later user can fall back on them knowingly. gearcore applies none of them silently.
# User decision 2026-10-03 (ADR-114): the `.ste` importer reads a file as STplus computes it, so it
# applies these defaults and records each application in its notes; where the manual and the
# program disagree, the program is followed and the entry says so.
# Program and version: see provenance.yaml (STplus 11.1F, Freigabe 01.12.2025).
#
#   <key>        name of the default
#   quantity     entry of data/quantities.yaml the default belongs to (null = none yet)
#   input_key    key of the STplus input file (.ste) that the default replaces
#   value        the preset value (number or text); null where the default is a rule
#   unit         unit of the value
#   rule         the default as a rule, in own words
#   applies_to   "user interface", "batch input" or "both" (the batch input is the .ste file)
#   manual       printed page of the manual (STplus_11-1F_Benutzeranleitung.pdf) and the sentence,
#                verbatim; null where the manual is silent
#   probe        what a run of STplus 11.1F showed: probes/<name>/report.sta.txt
#   file         packaged file of the installation that is the evidence
#   status       verified = manual sentence read on the rendered page and/or value seen in a probe
#                located  = found in the text layer of the manual only, not transcribed yet
#   note         what a reader has to know
#
# Scope: geometry input (manual section 4.2, p. 15 to 25), rack-type tools (p. 183 to 188) and the
# controls and limits of section 4.17.2 (p. 223 to 230, read on the rendered pages 2026-10-03).
# Defaults of the load capacity (p. 35 to 58), of shaper cutters (p. 189 to 192) and the material
# and lubricant databases are only located; they are transcribed with the stage that uses them.
defaults:
  normal_pressure_angle:
    quantity: normal_pressure_angle
    input_key: "EINGRIFFSWINKEL"
    value: 20.0
    unit: "deg"
    rule: null
    applies_to: "user interface"
    manual: { page: 15, text: "Der Normaleingriffswinkel α_n ist mit 20 Grad vorbelegt, er kann jedoch bei Bedarf geändert werden." }
    probe: "no_pressure_angle: a batch input without EINGRIFFSWINKEL is rejected ('ALN = 0.00', 'Eingaben ... sind unvollstaendig oder unzulaessig')"
    status: verified
    note: "The default belongs to the user interface; the batch input needs the angle."
  helix_angle:
    quantity: helix_angle
    input_key: "SCHRAEGUNGSWINKEL"
    value: null
    unit: "deg"
    rule: "without input the helix angle is computed by the program from the centre distance and the sum of the profile shift coefficients; gear 1 is then right-handed, gear 2 left-handed. Without a centre distance the input is rejected"
    applies_to: "both"
    manual: { page: 16, text: "Erfolgt keine Eingabe zum Schrägungswinkel, wird der Schrägungswinkel vom Programm berechnet. Rad 1 wird dabei als rechtssteigend angesehen, Rad 2 als linkssteigend." }
    probe: "helix_angle_from_centre_distance: z 20/40, m_n 2, x 0.4/0.2, a = 62.5 without SCHRAEGUNGSWINKEL is run with beta 12.13130; no_helix_angle_no_centre_distance: the same without ACHSABSTAND is rejected ('Eingaben ... sind unvollstaendig oder unzulaessig')"
    status: verified
    note: "Two of centre distance, helix angle and profile shift sum have to be given (manual Bild 4.12, p. 25; subroutine GE12, p. 343). Function stplus_helix_angle_deg."
  tip_diameter:
    quantity: tip_diameter
    input_key: "KOPFKREISDM"
    value: null
    unit: "mm"
    rule: "d_a = d + 2 m_n (h_aP* + x); afterwards the program checks the tip circle against the tool and the mating gear and reduces it to the feasible value"
    applies_to: "both"
    manual: { page: 19, text: "Erfolgt keine Eingabe zum Kopfkreisdurchmesser wird der Kopfkreis gemäß d_a = d + 2 • m_n • (h_aP* + x) berechnet. Innerhalb des Programmes wird überprüft, ob der Kopfkreis mit dem eventuell vorgegebenen Werkzeug oder der Radpaarung verträglich ist. Ist dieses nicht der Fall, wird der geometrisch ausführbare Kopfkreis verwendet, der das maßgebende Grenzkriterium gerade erfüllt." }
    probe: "defaults_minimal: d_a = 44.000 and 84.000 mm for z = 20 and 40, m_n = 2, x = 0 (h_aP* = 1.000); tip_circle_per_din3960: DA_NACH_DIN3960 = ja ja gives 45.347 / 85.347 with 'Kopfkreise 1/2 nach DIN 3960 gemaess k*m_n =-0.126 mm festgelegt'"
    status: verified
    note: "The input offers five other definitions of the tip circle (manual Bild 4.12, p. 25: BEZ_KOPFDICKE, DA_DURCH_WKZ, DA_NACH_DIN3960, KOPFSPIELFAKTOR, K_HOEHENF_VERZ_BEZ_PR). The importer does not translate them: a file that sets one for a gear without KOPFKREISDM is a NotSupportedError. Where KOPFKREISDM is given for both gears they have no effect: probe tip_circle_given_with_other_definitions (all five keys set) gives the listing of tip_circle_cut_by_tool (tip circles, tool factors, tip clearance); the importer says so in a note. The default circle is shortened by STplus afterwards where the tool, the tip tooth thickness or the mating gear require it (small_z8_x05 pinion 11,0 to 10,990; wheels of neg_shift_z17_xm08 and undercut_z12_x0); gearcore applies the cut by the tool only (GEN-16)."
  tip_chamfer_tangential:
    quantity: null
    input_key: null
    value: 0.7
    unit: "-"
    rule: "tangential amount of the tip chamfer = 0,7 times its radial amount h_K; residual tip thickness in the normal section s_aK = s_an - 2 (0,7 h_K)"
    applies_to: "both"
    manual: { page: 19, text: "Der Tangentialbetrag ist mit 0,7 • h_k vorbelegt und bestimmt die Restkopfdicke s_ak." }
    probe: "tip_chamfer_default: h_K 0.2 / 0.3 on tips of s_an 0.423 / 0.928 is run with 'Restdicke bei Kantenbruch/Kopfruecknahme 0.143 0.508'; tip_chamfer_helical: at beta = 25 degrees RESTDICKE = ZAHNDICKE_KOPF - 1.4 h_K in five decimals (1.12292 - 0.28 = 0.84292); tip_chamfer_tangential_given: TANG_BETRAG_ZU_H_KGF = 1.0 gives 0.928 - 0.6 = 0.328; tip_chamfer_tangential_two_values: 1.0 0.5 gives 0.223 and 0.328, the first value for both gears"
    status: verified
    note: "Factor of h_K; control TANG_BETRAG_ZU_H_KGF, range 0,3 to 1,5 (manual p. 225: 'Der Tangentialbetrag zu h_KgF ist mit 0,7 • h_KgF vorbelegt. Er kann zwischen 0,3 und 1,5 • h_KgF variiert werden.'). The manual writes the index in lower case on p. 19 (h_k, s_ak). See tip_chamfer_residual_floor and tip_chamfer_max."
  quality_din:
    quantity: quality_grade
    input_key: "DIN_QUALITAET"
    value: 7
    unit: "-"
    rule: null
    applies_to: "both"
    manual: { page: 19, text: "Die Verzahnungsqualität nach DIN ist mit 7 vorbelegt." }
    probe: "defaults_minimal: 'Verzahnungsqualitaet (DIN3961/63,Aug.78) N 7 N 7'"
    status: verified
    note: "DIN 3961/63 of 1978 are withdrawn; the current norm is DIN ISO 1328-1:2018-03 (increment 5)."
  tooth_thickness_allowance_series:
    quantity: tooth_thickness_allowance
    input_key: "ABMASS_TOL_REIHE"
    value: "c25"
    unit: "-"
    rule: null
    applies_to: "both"
    manual: { page: 19, text: "Die Zahndickentoleranzen und -abmaße sind mit c25 nach DIN 3967 vorbelegt." }
    probe: "defaults_minimal: 'Abmassreihe (DIN 3967, Aug.78) C C', 'Toleranzreihe (DIN 3967, Aug.78) 25 25'; A_ste = -0.065 and -0.085 mm, A_sti = -0.095 and -0.125 mm for d = 40 and 80 mm, m_n = 2"
    status: verified
    note: "DIN 3967:1978-08 is valid; the tables are implemented with increment 5."
  span_allowance_lower:
    quantity: span_allowance
    input_key: "UNTERES_ZAHNW_ABMASS"
    value: null
    unit: "µm"
    rule: "if only the upper span allowance A_We is given, the lower one is set equal to it"
    applies_to: "both"
    manual: { page: 20, text: "Wird nur das obere Zahnweitenabmaß A_We eingegeben, wird A_We = A_Wi gesetzt." }
    probe: "upper_span_allowance_only: OBERES_ZAHNW_ABMASS = -60 -80 alone is run with A_We -0.060 -0.080 and A_Wi -0.060 -0.080"
    status: verified
    note: null
  span_allowance_upper:
    quantity: span_allowance
    input_key: "OBERES_ZAHNW_ABMASS"
    value: null
    unit: "µm"
    rule: "without input A_We of gear 1 follows the default series, A_We of gear 2 follows from the sum of the upper span allowances"
    applies_to: "both"
    manual: { page: 20, text: "Werden keine Zahnweitenabmaße vorgeben so wird A_We1 gemäß der Vorbelegung belegt und A_We2 aus der Summe der oberen Zahnweitenabmaße berechnet." }
    probe: "defaults_minimal: A_We = -0.061 and -0.080 mm, A_Wi = -0.089 and -0.117 mm"
    status: verified
    note: null
  centre_distance_allowance:
    quantity: null
    input_key: "ACHSABST_MASS_DIN"
    value: "js7"
    unit: "-"
    rule: null
    applies_to: "both"
    manual: { page: 20, text: "Erfolgt keine Eingabe wird die Vorbelegung js = 7 verwendet." }
    probe: "defaults_minimal: 'Achsabstandsabmass A_Ae + 0.015 mm', 'A_Ai - 0.015 mm', 'nach DIN 3964 Toleranzfeld JS 7' for a = 60 mm"
    status: verified
    note: "DIN 3964:1980-11 is valid; the table is implemented with increment 5."
  number_of_teeth_spanned:
    quantity: number_of_teeth_spanned
    input_key: "MESSZAEHNEZAHL_K"
    value: null
    unit: "-"
    rule: "computed by the program; an input overrides it"
    applies_to: "both"
    manual: { page: 20, text: "Mit Hilfe der Eingaben zu Messzähnezahl k bzw. zu Messstückdurchmesser D_M können Werte vorgegeben werden, die von den programmintern berechneten Werten bzw. von den im 1. Fenster eingegebenen Werten abweichen." }
    probe: "defaults_minimal: k = 3 and 5 for z = 20 and 40"
    status: verified
    note: "Rule of the current norm: DIN 21773:2014-08 (increment 4)."
  measuring_ball_diameter:
    quantity: null
    input_key: "MESSTUECKDM_D_M"
    value: null
    unit: "mm"
    rule: "computed by the program; an input overrides it"
    applies_to: "both"
    manual: { page: 20, text: "Mit Hilfe der Eingaben zu Messzähnezahl k bzw. zu Messstückdurchmesser D_M können Werte vorgegeben werden, die von den programmintern berechneten Werten bzw. von den im 1. Fenster eingegebenen Werten abweichen." }
    probe: "defaults_minimal: D_M = 3.500 mm for m_n = 2"
    status: verified
    note: "How the program chooses D_M is not stated on the pages read; clarified with increment 4."
  default_rack_tool:
    quantity: null
    input_key: "WERKZEUG_VORVERZ."
    value: null
    unit: "-"
    rule: "without a tool the program uses a hob with the factors below, module and pressure angle of the gear, no protuberance and no machining allowance"
    applies_to: "both"
    manual: { page: 22, text: "Gibt der Benutzer kein Werkzeug vor, wird programmintern auf ein geeignetes Wälzwerkzeug zurückgegriffen. Hierfür sind im Programm Vorbelegungswerte vorhanden." }
    probe: "defaults_minimal: 'Zahnradfertigung mit Fraeser oder Hobelkamm', m_n0 = 2.0000, alfa_n0 = 20.0000, h_aP0* = 1.250, rho_aP0* = 0.250, h_FfP0* = 1.300, h_fP0* = 1.300, pr_0 = 0.000, q = 0.000"
    status: verified
    note: "The manual gives no numbers; they are read from the probe. A gear without a tool name gets this hob also where the other gear names a tool (probes tool_for_one_gear_only, tool_for_gear_one_only). The limits of the tool apply to it: at alpha_n = 28 degrees its tip rounding is 0.201, at 30 degrees 0.110 with root form height and dedendum 1.265 (probes default_hob_at_twenty_eight_degrees, default_hob_at_thirty_degrees)."
    tool: { addendum_factor: 1.25, tip_radius_factor: 0.25, dedendum_factor: 1.3, root_form_height_factor: 1.3, protuberance_mm: 0.0, machining_allowance_mm: 0.0 }
  predefined_tooth_space:
    quantity: null
    input_key: "PW_WKZV_WAEHLEN"
    value: null
    unit: "-"
    rule: "predefined tooth space (profile tool) instead of the default hob: addendum h_aP0 = 1,25 m_n, fully rounded tip"
    applies_to: "both"
    manual: { page: 22, text: "Als Vorbelegungswerte für die Profillücke sind folgende Profilwerkzeugwerte in STplus fest eingestellt: - Kopfhöhe h_aP0 = 1,25 • m_n - Art der Kopfrundung: Vollausrundung" }
    probe: null
    status: verified
    note: "Profile tools are an extension point of gearcore."
  tool_tip_radius:
    quantity: tool_tip_radius
    input_key: "KOPFABRUNDUNGSFAKTOR"
    value: 0.25
    unit: "-"
    rule: "a tool record without tip rounding gets rho_aP0* = 0,25"
    applies_to: "both"
    manual: null
    probe: "tool_without_tip_rounding: tool hochverz1 (no KOPFABRUNDUNGSFAKTOR) is run with 'Wkz-Kopfabrundungsfaktor rho_aP0* 0.250'"
    status: verified
    note: "Module factor. Not stated in the manual pages read; seen in the probe only. The preset is reduced to the full radius like a given value (probe tool_addendum_limited_without_tip_rounding: 0.086 at h_aP0* 1.993)."
  tool_module_and_pressure_angle:
    quantity: tool_normal_module
    input_key: "WKZ_NORMALMODUL"
    value: null
    unit: "mm"
    rule: "normal module and normal pressure angle of the tool equal those of the gear"
    applies_to: "both"
    manual: { page: 187, text: "Im Normalfall sind der Normalmodul und der Normaleingriffswinkel an Werkzeug und Stirnrad gleich groß. Dieser Fall entspricht zugleich der Vorbelegung." }
    probe: "tool_without_tip_rounding: m_n0 = 2.0000, alfa_n0 = 20.0000 for a record without module and angle"
    status: verified
    note: "gearcore does the same: None in the contract means the value of the gear."
  tool_protuberance_angle:
    quantity: tool_protuberance_angle
    input_key: "PROTUBERANZWINKEL"
    value: null
    unit: "deg"
    rule: "alpha_prn0 = alpha_n0 / 2; below 1 degree the protuberance amount is set to 0"
    applies_to: "both"
    manual: { page: 186, text: "Für Protuberanzwerkzeuge muss der Protuberanzwinkel α_prn0 ≥ 1,0° sein, für α_prn0 < 1° wird programmintern der Protuberanzbetrag p_rn = 0 gesetzt. Die Vorbelegung für den Protuberanzwinkel α_prn0 ist α_n0/2." }
    probe: "defaults_minimal prints 'Protuberanzwinkel alfa_pr0 20.000' for a tool without protuberance (pr_0 = 0.000), not alpha_n0 / 2"
    status: verified
    note: "Manual and listing disagree for a tool without protuberance; to be clarified with the protuberance flank (extension point)."
  tool_edge_break_angle:
    quantity: tool_edge_break_angle
    input_key: "KANTENBRECHWINKEL"
    value: 10.0
    unit: "deg"
    rule: "alpha_Kn0 = alpha_n0 + 10 degrees for the flank between the root form height and the dedendum of the tool; a tool root rounding is replaced by that flank"
    applies_to: "both"
    manual: { page: 186, text: "Der Kantenbrechwinkel α_Kn0 ist mit α_n0 + 10° vorbelegt. Eine gegebenenfalls vorhandene Fußausrundung mit Radius ρ_f0 wird für die Berechnung durch eine Kantenbrechflanke mit dem Winkel α_Kn0 ersetzt." }
    probe: "tool_root_both_heights: 0.9 / 1.5 without KANTENBRECHWINKEL is run with 'Kopfkantenbruch an Rad 1 durch Werkzeug (alfa_K0 = 30.00 grd)', d_Fa 46.307, h_K 0.047, Restdicke 0.407; tool_root_other_pressure_angle: at alpha_n = 25 degrees the dedendum limit is that of 35 degrees"
    status: verified
    note: "The value is the amount added to alpha_n0. gearcore's DIN 3960 A.3.1 chain with this angle reproduces the probe (46,3069 / 0,0466 / 0,4069) and example 1 of the manual (d_Fa 144,535 against 144.536 printed on p. 257). An angle of 90 degrees is no flank: see tool_without_edge_break_flank. An angle below the profile angle is replaced by this preset (probe tool_edge_break_angle_below_pressure_angle: KANTENBRECHWINKEL = 15 at alpha_n = 20 is run with 'alfa_K0 = 30.00 grd' and 'Wkz.daten ... geaendert'). See tool_edge_break_angle_range."
  tool_without_allowance_is_finishing_tool:
    quantity: machining_allowance
    input_key: "BEARBEITUNGSZUGABE"
    value: null
    unit: "mm"
    rule: "a single tool with a machining allowance is a pre-cutting tool, without one it is the finishing tool"
    applies_to: "both"
    manual: { page: 22, text: "Die Angabe einer Bearbeitungszugabe bewirkt, dass dieses Werkzeug als Vorverzahnungswerkzeug angesehen wird. Erfolgt keine Angabe zur Bearbeitungszugabe, wird das Werkzeug als Fertigverzahnungswerkzeug angesehen." }
    probe: "defaults_minimal: 'Gesamt-Bearbeitungszugabe q 0.000 0.000'"
    status: verified
    note: null
  tool_record_factor_before_absolute_value:
    quantity: tool_addendum
    input_key: "KOPFHOEHENFAKTOR"
    value: null
    unit: "-"
    rule: "if a tool record gives the factor and the absolute value of the addendum and they contradict, the factor is used; tip rounding and dedendum beyond the geometric limit are reduced by the program"
    applies_to: "both"
    manual: { page: 186, text: "Die jeweiligen Werkzeugfuß- und -kopfhöhen können entweder als Absolutwerte oder als auf den Normalmodul bezogene Faktoren (mit * gekennzeichnet) eingegeben werden." }
    probe: "tool_contradicting_record: record S_19_00374_F_(_77 (KOPFHOEHENFAKTOR = 1.6, KOPFHOEHE = 5.377 at m_n0 = 2.8; KOPFABRUNDUNGSFAKTOR = 0.5; FUSSHOEHENFAKTOR = 3.0) is run with h_aP0* = 1.600, rho_aP0* = 0.383, h_fP0* = 2.317 and the message 'Wkz.daten h_FfP0*, d_Ff0, alfa_Kn0 oder alfa_Kt0 fuer Rad 1 geaendert'"
    status: verified
    note: "The manual says 'either ... or' and does not state a precedence. STplus computes with the factors, reduces tip rounding, root form height and dedendum to its limits and prints both remarks ('Werkzeugdaten h_aP0*, d_a0, rho_aP0 oder rho_at0 ... geaendert', 'Wkz.daten h_FfP0* ... geaendert'). The importer reads the record the same way and keeps the contradiction as an issue of the record (ADR-114)."
  tool_addendum:
    quantity: tool_addendum
    input_key: "KOPFHOEHENFAKTOR"
    value: 1.25
    unit: "-"
    rule: "a tool record without addendum gets h_aP0* = 1,25"
    applies_to: "both"
    manual: null
    probe: "tool_without_addendum: a tool block that gives the tip rounding only is run with 'Kopfhoehenfaktor (Wkz_Bezugspr.) h_aP0* 1.250'"
    status: verified
    note: "Module factor. Not stated in the manual; seen in the probe only."
  tool_tip_land_limit:
    quantity: tool_addendum
    input_key: "MIN_WKZ_ZAHNKOPFDICKE*"
    value: 0.12
    unit: "-"
    rule: "preset of the program for the smallest tip thickness factor s_a0* of the tool (the manual says 0,2); largest addendum of a rack tool: h_aP0* = (pi/2 - s_a0*) / (2 tan alpha_n), a larger one is reduced to it"
    applies_to: "both"
    manual: { page: 224, text: "Die max. Werkzeugkopfhöhe wird über den min. Werkzeug-Zahnkopfdickenfaktor s_a0* erfasst (Vorbelegung = 0,2, möglicher Bereich = 0,1 ... 1,0)." }
    probe: "tool_addendum_limited: KOPFHOEHENFAKTOR = 2.1 at 20 degrees is run with h_aP0* 1.993, rho_aP0* 0.086 and 'Werkzeugdaten h_aP0*, d_a0, rho_aP0 oder rho_at0 fuer Rad 1 geaendert'; tool_tip_land_control_at_program_preset: with MIN_WKZ_ZAHNKOPFDICKE* = 0.12 the same 1.993; tool_tip_land_control: with 0.2 the addendum is limited to 1.883"
    status: verified
    note: "Manual and program disagree: the manual presets the control with 0,2, the program with 0,12 (1.993 at 20, 2.707 at 15, 1.556 at 25 degrees without the control). The control itself acts as documented: in exploratory runs with 0.105 to 0.7 the tip land of the straight flanks at the limited addendum equals the value in five decimals, at 20 and 25 degrees. The ends 0.1 and 1.0 of the range are not accepted (probe tool_controls_at_the_ends_of_their_ranges). Function stplus_max_tool_addendum_factor."
  tool_tip_radius_limit:
    quantity: tool_tip_radius
    input_key: "KOPFABRUNDUNGSFAKTOR"
    value: null
    unit: "-"
    rule: "a tip rounding beyond the full radius, rho* = (pi/4 - h_aP0* tan alpha_n) / (1/cos alpha_n - tan alpha_n), is reduced to it"
    applies_to: "both"
    manual: null
    probe: "tool_tip_rounding_limited: KOPFABRUNDUNGSFAKTOR = 0.6 with h_aP0* = 1.25 at 20 degrees is run with rho_aP0* 0.472 and the message 'Werkzeugdaten h_aP0*, d_a0, rho_aP0 oder rho_at0 fuer Rad 1 geaendert'; tool_contradicting_record: 0.5 with h_aP0* = 1.6 at 17,5 degrees becomes 0.383; default_hob_at_twenty_eight_degrees: the preset 0.25 becomes 0.201, without a remark"
    status: verified
    note: "Function stplus_max_tool_tip_radius_factor. gearcore's generation rejects an overlapping rounding; the importer reduces it as STplus does and says so."
  tool_root_form_height:
    quantity: tool_root_form_height
    input_key: "FUSSFORMHOEHENFAKTOR"
    value: 1.3
    unit: "-"
    rule: "a tool record without root form height gets h_FfP0* = 1,3"
    applies_to: "both"
    manual: { page: 224, text: "Der Werkzeug-Fußformhöhenfaktor h_Ff0* ist mit 1,1, der Werkzeug-Fußhöhenfaktor h_f0* mit 1,3 vorbelegt. Sie können zwischen 0 und 3 variiert werden." }
    probe: "tool_root_angle_only: a tool that gives the edge break angle only is run with 'Fussform-Hoehenf.(Wkz-Bezugspr.) h_FfP0* 1.300' and 'Kein Kopfkantenbruch durch Werkzeug 1'; defaults_minimal lists 1.300 for the default hob"
    status: verified
    note: "Manual and program disagree: the manual presets 1,1 (p. 224, controls VB_FUSSFORMHOEHE_HFF0*), the program computes and lists 1,300, as the listing of the manual's own example 1 does (p. 259). Known at the FZG (user, 2026-10-03); gearcore follows the program (ADR-114). Setting the VB keys changed nothing in the probe tool_root_presets_of_the_configuration."
  tool_dedendum:
    quantity: tool_dedendum
    input_key: "FUSSHOEHENFAKTOR"
    value: 1.3
    unit: "-"
    rule: "a tool record without dedendum gets h_fP0* = 1,3"
    applies_to: "both"
    manual: { page: 224, text: "Der Werkzeug-Fußformhöhenfaktor h_Ff0* ist mit 1,1, der Werkzeug-Fußhöhenfaktor h_f0* mit 1,3 vorbelegt. Sie können zwischen 0 und 3 variiert werden." }
    probe: "tool_root_form_height_only: FUSSFORMHOEHENFAKTOR = 0.9 alone is run with h_FfP0* 0.900, h_fP0* 1.300 and 'Kopfkantenbruch an Rad 1 durch Werkzeug (alfa_K0 = 30.00 grd)'"
    status: verified
    note: null
  tool_dedendum_not_below_root_form_height:
    quantity: tool_dedendum
    input_key: "FUSSHOEHENFAKTOR"
    value: null
    unit: "-"
    rule: "a dedendum below the root form height is set equal to it; the tool then has no edge break flank, and its root line cuts a tip circle that lies above it"
    applies_to: "both"
