  arc_difference:
    quantity: root_form_diameter
    input_key: "BOGENDIFFERENZ"
    value: 10000.0
    unit: "-"
    rule: "two tooth thickness arcs count as equal where they differ by less than m_n / DESTGR (iteration limit of the form circles)"
    applies_to: "both"
    manual: { page: 227, text: "Die Differenz zweier Kreisdickenbögen, die als gleich groß angesehen werden (Iterationsgrenze für Formkreise), ist als m_n / DESTGR definiert. Die bezogene Differenz zweier Zahndickenbögen DESTGR ist mit 10000 vorbelegt, der mögliche Einstellbereich beträgt 5000 bis 100000." }
    probe: "defaults_minimal: 'Geometrieberechnungs-Genauigkeitsgrenzwert DESTGR ... In aktueller Rechnung verwendeter Wert: 0.0002000000. Bis STplus 8.1F verwendeter Grenzwert: 0.0004000000.' (m_n = 2: 2 / 10000)"
    status: verified
    note: "Why the form circles of STplus are numerical: at its printed root form diameters of the four undercut pinions the tooth thickness arcs of fillet and involute differ by 1,0 to 4,0 times m_n / 10000 (2026-10-03), which explains the order of the accuracy parity.FORM_CIRCLE_ACCURACY_MM allows. Confirmed by experiment: with BOGENDIFFERENZ = 20000 and 50000 the root form diameter of the undercut pinion of fzg_c moves from 67.68506 to 67.68128 and 67.67939, onto the intersection of fillet and involute gearcore computes (67.67870): 6,4 um, 2,6 um, 0,7 um (probes form_circle_limit_twenty_thousand, form_circle_limit_fifty_thousand). The upper bound 100000 of the range is not accepted (the preset stays)."
  helix_angle_iteration_limit:
    quantity: helix_angle
    input_key: "GRENZE_BETA_ITERATION"
    value: 0.000001
    unit: "-"
    rule: "limit of the iteration of the helix angle"
    applies_to: "both"
    manual: { page: 227, text: "Die Grenze für β-Iteration ist mit 10^-6 vorbelegt und kann zwischen 10^-8 und 10^-6 variiert werden." }
    probe: null
    status: verified
    note: "gearcore solves the helix angle to the precision of binary64 (stplus_helix_angle_deg). The probe helix_angle_from_centre_distance lists 12.13130 where the equation gives 12.13222 degrees; at the listed angle the sum of the profile shift coefficients that belongs to the centre distance is 0.60012 (interface file), so the iteration of STplus ends before the equation is met. This control does not end it: at its lower bound 1E-8 the listing is the same (probe helix_angle_iteration_limit_tightened), and so it is with BOGENDIFFERENZ, KREISDIFFERENZ and MAX_ITERATIONSSCHRITTE (exploratory runs). For 18 pairs (m_n 1 to 8, with and without profile shift; probe helix_angle_without_profile_shift: 16.25980 where arccos(60 / 62.5) is 16.26020 degrees) the centre distance that belongs to the listed angle lies 0,05 to 0,43 um below the given one, never above: the iteration ends when the centre distance is met within about 0,5 um, and STplus adds the remainder to x_2 (SUMME_X 0.60012, 0.00006)."
