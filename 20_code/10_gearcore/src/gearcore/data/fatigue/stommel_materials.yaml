      23: { sigma_B_S_mpa: 115.51, sigma_SK_mpa: 80.86, sigma_WK_mpa: 28.88, M: 0.25 }
      80: { sigma_B_S_mpa: 88.98, sigma_SK_mpa: 59.60, sigma_WK_mpa: 20.02, M: 0.225 }
