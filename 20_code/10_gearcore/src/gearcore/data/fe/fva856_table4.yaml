# Elastic constants of the skin layers of PA46-GF30 from FVA 856 I (FVA-Heft 1491, 2022),
# Tabelle 4 "Per GeoDict umgerechnete elastische Konstatanten der Randschichten
# (konditioniert)", printed page 23 (PDF page 37; the page was recorded as 22/35 on 2026-10-13 and
# corrected on 2026-10-18 against the page marker of the text layer, printed 23 = PDF 37, offset 14;
# printed page 22 carries Tabelle 3), transcribed by pdftotext on 2026-10-13 and
# checked digit by digit against the layout extraction; the thousands separator of the report
# (6.277) is dropped, the decimal comma becomes a point. The report converts the tensile tests
# (0 degree and 90 degree specimens, three temperatures, three test speeds) with a micro-
# mechanical cell of the three-layer specimen (GeoDict) into the constants of the oriented
# skin layer, section 6.3.1. The report states the 1-direction as the preferred fibre
# direction and E_2 as perpendicular to it ("E1 (Richtung der Faservorzugsrichtung) und E2
# (senkrecht dazu)", section 6.3.2, printed page 22); that 2 lies in the plane of the plate
# and 3 is the thickness direction is INFERRED from the plate-shaped specimen cell, not
# quoted. The report writes RT for the room temperature rows (its test matrix names -20, 23
# and 80 degC, section 6.3.1; Tabelle 20 on printed page 116 uses the same E_2 values at
# 23 degC). The rates QS, DY1, DY2 are those of the CONVERSE cards of the user
# (converse_rates.yaml): the rows of Tabelle 4 carry the same names.
