# Quantity registry — the single source of truth for names, symbols and designations.
#
# One entry per physical quantity. Contracts, fixtures, the comparison with STplus, the notebooks
# and the generated table `quantities.md` take symbol, unit and designation from here; nothing
# defines a symbol a second time (project rule 3b, ADR-108). Every increment adds the quantities it
# introduces before it uses them.
#
#   <key>        program name. A contract field is this name without the context prefix of its
#                model (`tool_`, `basic_rack_`), plus `_factor` for a module factor, plus the unit
#                suffix (`_mm`, `_deg`, `_um`).
#   symbol       symbol of the governing norm; subscripts follow an underscore, Greek letters are
#                spelled out (alpha, beta, eta, psi, rho, xi). A module factor appends `*`.
#   unit         unit of the quantity. DIN ISO 21771 §3.3 (p. 18): angles enter equations in radian
#                and may be given and shown in degree; contracts hold degrees (`_deg`), functions
#                of single equations take radians (`_rad`). A contract field declared as module
#                factor holds quantity / m_n and has no unit. Micrometre is written µm, the field
#                suffix is `_um` (names are ASCII).
#   description  designation of the governing norm, verbatim. Text in parentheses is an own remark
#                where the document prints a symbol without a designation.
#   source       key in sources.yaml of the governing norm; location = where it is printed
#   english      English designation of an ISO document in the repository, verbatim (null = none
#                found; the program name is then a translation of `description`)
#   also         symbols and designations other CURRENT documents print for the same quantity
#   stplus       STplus 11.1F: symbol and label of the listing (.sta), key of the input (.ste) and
#                of the interface file (.sts). null = none recorded yet (quantities of the load
#                capacity get their STplus names with stage 2).
#   replaced     what withdrawn or older norms print for this quantity, also where the symbol is
#                the same as today. DIN 3960 lists symbols in §2.1 without the index of the section
#                (s, e, p_b, p_e, alpha_y); its clauses write s_t, s_n, ... and give the short form
#                for a spur gear, so the clause is cited and the entry of §2.1 is named with it.
#   note         what a reader has to know when the documents differ
#   since        increment that introduced the quantity
#   status       verified = every text above was read on the rendered page (independent review
#                           of 2026-09-29: gate_reports/increment_1.md)
#                pending  = the contract carries the quantity, the designation is not verified yet;
#                           no computation, fixture or notebook may use it
#
# Governing norm of the geometry: DIN ISO 21771:2014-08 (with Anhang NB). Basic rack: DIN ISO 21771
# §3.1 and Bild 4, completed by DIN 867:1986-02 and ISO 53:1998.
