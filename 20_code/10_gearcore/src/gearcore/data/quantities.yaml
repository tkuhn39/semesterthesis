    status: verified
  dedendum:
    symbol: "h_f"
    unit: "mm"
    description: "Zahnfußhöhe"
    source: "ISO21771:2014"
    location: "§3.1 symbol list, p. 12; §4.6.2 Eq. (37), p. 34"
    english: null
    also: []
    stplus: null
    replaced:
      - { symbol: "h_f", description: "Zahnfußhöhe", source: "DIN3960:1987", location: "§2.1, p. 2" }
    note: "Eq. (37) writes the nominal root diameter d_f and an absolute value; the generation evaluates the first form without the absolute value with the generated root diameter d_fE: signed, negative where x_E m_n exceeds the tool addendum (root circle above the reference circle). STplus prints no dedendum."
