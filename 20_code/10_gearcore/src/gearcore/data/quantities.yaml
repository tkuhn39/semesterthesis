  # ---- tool-based generation and tooth contour (increment 3) -------------------------------------
  tool_tip_form_height:
    symbol: "h_FaP0"
    unit: "mm"
    description: "gerader Teil der Kopfflanke des Werkzeug-Erzeugungsprofils"
    source: "ISO21771:2014"
    location: "§7.6 Bild 39 legend, p. 69; §7.7 Eq. (135), p. 70"
    english: null
    also: []
    stplus: null
    replaced:
      - { symbol: "h_FaP0", description: "Kopf-Formhöhe des Werkzeug-Bezugsprofils", source: "DIN3960:1987", location: "§2.1, p. 2; §3.6.6 Eq. (3.6.06), p. 14" }
    note: "Height of the straight part of the tool addendum, h_FaP0 = h_aP0 - rho_aP0 (1 - sin alpha_n): the bracket of Eq. (128) in Anhang NB (p. 6). DIN ISO 21771 letters it in Bild 36 a) (p. 64) and names it in the legend of Bild 39 only."
    since: 3
    status: verified
  upper_generating_profile_shift_coefficient:
    symbol: "x_Es"
    unit: "-"
    description: "(Erzeugungs-Profilverschiebungsfaktor am oberen Zahndickenabmaß; lettered in Bild 38 and Eq. (123), index s of §3.2)"
    source: "ISO21771:2014"
    location: "§7.4 Eq. (123) and Bild 38, p. 67; §3.2 index s, p. 17"
    english: null
    also: []
    stplus: null
    replaced:
      - { symbol: "x_Ee", description: "(Erzeugungs-Profilverschiebungsfaktor der Fertigverzahnung am oberen Zahndickenabmaß; index e as in A_se)", source: "DIN3960:1987", location: "§3.6.3 after Eq. (3.6.03), p. 14" }
    note: "x_Es = x + E_sns / (2 m_n tan alpha_n) for a finished gear (q = 0). The generation of a gear is evaluated at this value (maximum material); the lower value is reported alongside. DIN 3960 writes the index e for the upper limit (x_Ee, A_se), DIN ISO 21771 the index s (§3.2, p. 17)."
    since: 3
    status: verified
  lower_generating_profile_shift_coefficient:
    symbol: "x_Ei"
    unit: "-"
    description: "(Erzeugungs-Profilverschiebungsfaktor am unteren Zahndickenabmaß; lettered in Bild 38 and Eq. (124), index i of §3.2)"
    source: "ISO21771:2014"
    location: "§7.4 Eq. (124) and Bild 38, p. 67; §3.2 index i, p. 17"
    english: null
    also: []
    stplus: null
    replaced:
      - { symbol: "x_Ei", description: "(Erzeugungs-Profilverschiebungsfaktor der Fertigverzahnung am unteren Zahndickenabmaß)", source: "DIN3960:1987", location: "§3.6.3 after Eq. (3.6.03), p. 14" }
    note: "x_Ei = x + E_sni / (2 m_n tan alpha_n) for a finished gear (q = 0)."
    since: 3
    status: verified
  min_generating_profile_shift_coefficient:
    symbol: "x_Emin"
    unit: "-"
    description: "Erzeugungs-Profilverschiebungsfaktor bei Unterschnittgrenze"
    source: "ISO21771:2014"
    location: "§3.1 symbol list, p. 13; §7.7 Eq. (135), p. 70"
    english: null
    also: []
    stplus: null
    replaced:
      - { symbol: "x_Emin", description: "Erzeugungs-Profilverschiebungsfaktor bei Unterschnittgrenze", source: "DIN3960:1987", location: "§2.1, p. 3; §3.6.6 Eq. (3.6.06), p. 14" }
    note: "For a rack-type tool without protuberance: x_Emin = h_FaP0 / m_n - z sin^2(alpha_t) / (2 cos beta). A gear generated with x_E < x_Emin is undercut; its root form diameter then follows from the intersection of the fillet with the involute (§7.6, p. 70)."
    since: 3
    status: verified
  lower_generated_root_diameter:
    symbol: "d_fEi"
    unit: "mm"
    description: "(erzeugter Fußkreisdurchmesser am unteren Zahndickenabmaß; lettered in Bild 38, index i of §3.2)"
    source: "ISO21771:2014"
    location: "§7.4 Bild 38, p. 67; §7.5 Eq. (125), p. 68"
    english: null
    also: []
    stplus: null
    replaced: []
    note: "Eq. (125) with x_Ei. Bild 38 letters d_fEs for the upper allowance, which the program reports as the generated root diameter d_fE."
    since: 3
    status: verified
  tip_clearance:
    symbol: "c"
    unit: "mm"
    description: "Kopfspiel"
    source: "ISO21771:2014"
    location: "§3.1 symbol list, p. 11; §5.2.7 Eq. (60), p. 41"
    english: null
    also: []
    stplus: { symbol: "c", label: "Kopfspiel (Istwert)", input_key: null, interface_key: "KOPFSPIEL" }
    replaced:
      - { symbol: "c", description: "Kopfspiel", source: "DIN3960:1987", location: "§2.1, p. 2" }
    note: "Per gear: the clearance of its tip against the generated root of the mating gear, c_1 = a_w - d_a1 / 2 - d_fE2 / 2. STplus also prints c* = c / m_n ('bezogenes Kopfspiel', BEZOGENES_KOPFSPIEL)."
    since: 3
    status: verified
  form_over_dimension:
    symbol: "c_F"
    unit: "mm"
    description: "Formübermaß"
    source: "ISO21771:2014"
    location: "§3.1 symbol list, p. 11; §5.4.4 Eq. (76), p. 45"
    english: null
    also: []
    stplus: { symbol: "c_n", label: "Formuebermass", input_key: null, interface_key: "FORMUEBERMASS" }
    replaced:
      - { symbol: "c_F", description: "Formübermaß", source: "DIN3960:1987", location: "§2.1, p. 2" }
    note: "Radial distance between the start of the active profile and the root form circle, c_F = (d_Nf - d_Ff) / 2. STplus prints the symbol c_n for it. The program name translates the German designation."
    since: 3
    status: verified
  tooth_depth:
    symbol: "h"
    unit: "mm"
    description: "Zahnhöhe (zwischen Kopf- und Fußkreis)"
    source: "ISO21771:2014"
    location: "§3.1 symbol list, p. 12; §4.6.1 Eq. (35), p. 34"
    english: null
    also: []
    stplus: { symbol: "h", label: "Zahnhoehe", input_key: null, interface_key: "ZAHNHOEHE" }
