      - { symbol: "s_ta", description: "Kopfzahndicke in der Stirnebene ohne Kantenbruch", source: "DIN3960:1987", location: "Anhang A, p. 51" }
    note: "Arc thickness on the tip circle, evaluated with the generating profile shift coefficient x_E (§4.7, p. 35: with x_E the equations give the generated values). The program name follows the wording 'Kopfzahndicke' of §7.9."
    since: 3
    status: verified
  normal_tip_tooth_thickness:
    symbol: "s_an"
    unit: "mm"
    description: "(Kopfzahndicke im Normalschnitt: s_yn of Eq. (48) on the tip cylinder, index a of §3.2)"
    source: "ISO21771:2014"
    location: "§7.9, p. 70; §4.7.5 Eq. (48), p. 37; §3.2 index a, p. 17"
    english: null
    also: []
    stplus: { symbol: "s_an", label: "Zahndicke am Kopfkreis fuer A_We", input_key: null, interface_key: "ZAHNDICKE_KOPF" }
    replaced: []
    note: "s_an = s_at cos(beta_a) with the helix angle on the tip cylinder (Eq. (8)). STplus prints it 'fuer A_We', i.e. with the upper allowance (the generating profile shift coefficient x_E)."
    since: 3
    status: verified
  residual_tip_thickness:
    symbol: "s_aK"
    unit: "mm"
    description: "Restzahndicke am Zahnkopf bei Kopfkantenbruch oder Kopfkantenrundung"
    source: "ISO21771:2014"
    location: "§3.1 symbol list, p. 13; §6.1.2 and Bild 24, p. 55"
    english: null
    also: []
    stplus: { symbol: null, label: null, input_key: null, interface_key: "RESTDICKE" }
    replaced:
      - { symbol: "s_aK", description: "Restzahndicke am Zahnkopf bei Kopfkantenbruch oder Kopfkantenrundung", source: "DIN3960:1987", location: "§2.1, p. 3" }
      - { symbol: "s_taK", description: "Rest-Kopfzahndicke in der Stirnebene bei Kantenbruch", source: "DIN3960:1987", location: "Anhang A, p. 51; Eq. (A.3.05), p. 52" }
    note: "In the transverse section (DIN 3960 Eq. (A.3.05)). With a chamfer generated by the edge break flank of the tool it follows from DIN 3960 A.3.1; with a chamfer given by its radial height h_K it is an input (Bild 24 defines a chamfer by h_K and s_aK). The listing prints it without a symbol ('Restdicke bei Kantenbruch/Kopfruecknahme') and prints the tip tooth thickness where there is no chamfer. For a chamfer given by h_K STplus forms the residual thickness in the normal section (s_an - 2 * 0,7 h_K, at least 0,2 s_an); the .ste importer converts it onto the transverse arc of this field and records it (ADR-114)."
    since: 3
    status: verified

