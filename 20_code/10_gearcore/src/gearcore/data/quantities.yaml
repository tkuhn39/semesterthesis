    since: 3
    status: verified
  pre_machining_generating_profile_shift_coefficient:
    symbol: "x_EsV/x_EiV"
    unit: "-"
    description: "(Erzeugungs-Profilverschiebungsfaktor einer Vorverzahnung mit Bearbeitungszugabe q; lettered in Eq. (120), (121), index V)"
    source: "ISO21771:2014"
    location: "§7.4 Eq. (120), (121), p. 67"
    english: null
    also: []
    stplus: null
    replaced:
      - { symbol: "x_EV/x_EiV", description: "(Profilverschiebungsfaktoren der Vorverzahnung, q > 0)", source: "DIN3960:1987", location: "§3.6.3 after Eq. (3.6.03), p. 14" }
    note: "x_EsV m_n = x_Ei m_n + q_max / sin alpha_n, x_EiV m_n = x_Es m_n + q_min / sin alpha_n. Returned by generation.pre_machining_generating_profile_shift_coefficient with one allowance q; the finished gear of a pre-machining tool is an extension point (GEN-01)."
    since: 3
    status: verified
  transverse_tip_tooth_thickness:
    symbol: "s_at"
    unit: "mm"
    description: "(Kopfzahndicke im Stirnschnitt: s_yt of Eq. (38) on the tip cylinder, index a of §3.2; §7.9 names the 'Kopfzahndicke' without a symbol)"
    source: "ISO21771:2014"
    location: "§7.9, p. 70; §4.7.1 Eq. (38), p. 35; §3.2 index a, p. 17"
    english: null
    also: []
    stplus: null
    replaced:
