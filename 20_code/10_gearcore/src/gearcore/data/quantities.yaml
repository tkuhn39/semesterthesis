    note: "Eq. (35) writes the nominal root diameter d_f and an absolute value; the generation evaluates the first form of the equation with the generated root diameter d_fE, as STplus prints it, and raises where the root does not lie below the tip."
    since: 3
    status: verified
  addendum:
    symbol: "h_a"
    unit: "mm"
    description: "Zahnkopfhöhe"
    source: "ISO21771:2014"
    location: "§3.1 symbol list, p. 12; §4.6.2 Eq. (36), p. 34"
    english: null
    also: []
    stplus: { symbol: "h_a", label: "Kopfhoehe (bezogen auf Teilkreis)", input_key: null, interface_key: "KOPFHOEHE" }
    replaced:
      - { symbol: "h_a", description: "Zahnkopfhöhe", source: "DIN3960:1987", location: "§2.1, p. 2" }
