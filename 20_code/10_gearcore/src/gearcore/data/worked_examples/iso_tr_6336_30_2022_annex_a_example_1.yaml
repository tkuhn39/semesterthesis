    description: "Material allowance for finishing"
    symbol: "q"
    unit: "mm"
    printed: { pinion: "q_1 = 0,00 mm", wheel: "q_2 = 0,00 mm" }
    pinion: 0.0
    wheel: 0.0
  tip_relief_um:
    table: "Table A.1"
    description: "Tip relief"
    symbol: "C_a"
    unit: "µm"
