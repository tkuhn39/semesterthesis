    note: "row of Table A.5 'Load data' (p. 45), given for the pinion only; used by v_w and v in A.6"
    printed: "n_1 = 360 min^-1"
    value: 360.0

# ---- A.6 — Supplementary calculations (printed p. 45 and 46), all 25 results ---------------------
expected:
  gear_ratio:
    page: 45
    description: "Gear ratio"
    symbol: "u"
    formula: "u = z_2 / z_1"
    unit: "-"
    printed: "6,058 82"
    value: 6.05882
    decimals: 5
  transverse_module_mm:
    page: 45
    description: "Transverse module"
    symbol: "m_t"
    formula: "m_t = m_n / cos(beta)"
    unit: "mm"
    printed: "8,314 12 mm"
    value: 8.31412
    decimals: 5
  reference_diameter_mm:
    page: 45
    description: "Reference diameter"
    symbol: "d"
    formula: "d_1 = z_1 · m_t; d_2 = z_2 · m_t"
    unit: "mm"
    printed: { pinion: "141,340 mm", wheel: "856,355 mm" }
    pinion: 141.340
    wheel: 856.355
    decimals: 3
  inv_alpha_n_rad:
    page: 45
    quantity: involute_function
    description: "Involute normal pressure angle"
    meaning: "involute function of the normal pressure angle alpha_n"
    symbol: "inv alpha_n"
    formula: "inv alpha_n = tan(alpha_n) - alpha_n"
    unit: "rad"
    printed: "0,014 90 rad"
    value: 0.01490
    decimals: 5
  transverse_pressure_angle_deg:
    page: 45
    description: "Transverse pressure angle"
    symbol: "alpha_t"
    formula: "alpha_t = atan(tan(alpha_n) / cos(beta))"
    unit: "deg"
    printed: "20,720°"
    value: 20.720
    decimals: 3
  inv_alpha_t_rad:
    page: 45
    quantity: involute_function
    description: "Transverse pressure angle"
    meaning: "involute function of the transverse pressure angle alpha_t; the norm prints it as the second formula of the row 'Transverse pressure angle', without a label of its own"
    symbol: "inv alpha_t"
    formula: "inv alpha_t = tan(alpha_t) - alpha_t"
    unit: "rad"
    printed: "0,016 63 rad"
    value: 0.01663
    decimals: 5
  transverse_working_pressure_angle_deg:
    page: 45
    description: "Transverse working pressure angle"
    symbol: "alpha_wt"
    formula: "alpha_wt = acos(abs(z_1 + z_2) · (m_n · cos(alpha_t)) / (2 · a_w · cos(beta)))"
    unit: "deg"
    printed: "21,066°"
    value: 21.066
    decimals: 3
  generating_profile_shift_coefficient:
    page: 45
    description: "Generating profile shift coefficient"
    symbol: "x_E"
    formula: "x_E1 = (W_k1 - m_n · cos(alpha_n) · (pi · (k_1 - 0,5) + z_1 · inv alpha_t)) / (2 · m_n · sin(alpha_n)); x_E2 alike"
    unit: "-"
    printed: { pinion: "0,117 79", wheel: "-0,027 48" }
    pinion: 0.11779
    wheel: -0.02748
    decimals: 5
  generated_root_diameter_mm:
    page: 45
    description: "Root diameter (based on generating profile shift coefficient, x_E)"
    symbol: "d_f"
    formula: "d_f1 = d_1 - 2 · (h_fP1 - x_E1 · m_n); d_f2 alike"
    unit: "mm"
    printed: { pinion: "120,825 mm", wheel: "833,515 mm" }
    pinion: 120.825
    wheel: 833.515
    decimals: 3
  root_form_diameter_mm:
    page: 45
    description: "Root form diameter (based on generated profile shift coefficient, x_E; in this case there is no undercut or protuberance, so the following formula can be applied)"
    symbol: "d_Ff"
    formula: "d_Ff1 = sqrt((d_1 · sin(alpha_t) - 2 · (h_aP0 - x_E1 · m_n - rho_aP0 · (1 - sin(alpha_n))) / sin(alpha_t))^2 + d_b1^2); d_Ff2 alike"
    unit: "mm"
    printed: { pinion: "132,248 mm", wheel: "839,084 mm" }
    pinion: 132.248
    wheel: 839.084
    decimals: 3
  base_diameter_mm:
    page: 45
    description: "Base diameter"
    symbol: "d_b"
    formula: "d_b1 = d_1 · cos(alpha_t); d_b2 = d_2 · cos(alpha_t)"
    unit: "mm"
    printed: { pinion: "132,199 mm", wheel: "800,968 mm" }
    pinion: 132.199
    wheel: 800.968
    decimals: 3
  base_helix_angle_deg:
    page: 45
    description: "Base helix angle"
    symbol: "beta_b"
    formula: "beta_b = atan(tan(beta) · cos(alpha_t))"
    unit: "deg"
    note: "the norm prints the inverse tangent as tan with the exponent -1"
    printed: "14,825°"
    value: 14.825
    decimals: 3
  working_pitch_diameter_mm:
    page: 46
    description: "Working pitch diameter"
    symbol: "d_w"
    formula: "d_w1 = d_b1 / cos(alpha_wt); d_w2 = d_b2 / cos(alpha_wt)"
    unit: "mm"
    printed: { pinion: "141,667 mm", wheel: "858,333 mm" }
    pinion: 141.667
    wheel: 858.333
    decimals: 3
  normal_pitch_mm:
    page: 46
    description: "Normal pitch"
    symbol: "p_n"
    formula: "p_n = pi · m_n"
    unit: "mm"
    printed: "25,133 mm"
    value: 25.133
    decimals: 3
  transverse_pitch_mm:
    page: 46
    description: "Transverse pitch"
    symbol: "p_t"
    formula: "p_t = pi · m_t"
    unit: "mm"
    printed: "26,120 mm"
    value: 26.120
    decimals: 3
  transverse_base_pitch_mm:
    page: 46
    description: "Transverse base pitch"
    symbol: "p_bt"
    formula: "p_bt = p_t · cos(alpha_t)"
    unit: "mm"
    printed: "24,430 mm"
    value: 24.430
    decimals: 3
  transverse_contact_pitch_mm:
    page: 46
    description: "Transverse base pitch on the path of contact"
    symbol: "p_et"
    formula: "p_et = p_bt"
    unit: "mm"
    printed: "24,430 mm"
    value: 24.430
    decimals: 3
  length_of_path_of_contact_mm:
    page: 46
    description: "Length of line of contact"
    symbol: "g_alpha"
    formula: "g_alpha = 1/2 · (sqrt(d_Na1^2 - d_b1^2) + z_2 / abs(z_2) · (sqrt(d_Na2^2 - d_b2^2) - 2 · a_w · sin(alpha_wt)))"
    unit: "mm"
    printed: "37,845 mm"
    value: 37.845
    decimals: 3
  sap_diameter_mm:
    page: 46
    description: "SAP diameter"
    meaning: "diameter at the start of the active profile"
    symbol: "d_Nf"
    formula: "d_Nf1 = sqrt((2 · abs(a) · sin(alpha_wt) - sqrt(d_Fa2^2 - d_b2^2))^2 + d_b1^2); d_Nf2 = z_2 / abs(z_2) · sqrt((2 · a · sin(alpha_wt) - sqrt(d_Fa1^2 - d_b1^2))^2 + d_b2^2)"
    unit: "mm"
    printed: { pinion: "132,921 mm", wheel: "845,225 mm" }
    pinion: 132.921
    wheel: 845.225
    decimals: 3
  transverse_contact_ratio:
    page: 46
    description: "Transverse contact ratio"
    symbol: "epsilon_alpha"
    formula: "epsilon_alpha = g_alpha / p_et"
    unit: "-"
    printed: "1,549 09"
    value: 1.54909
    decimals: 5
  overlap_ratio:
    page: 46
    description: "Overlap ratio"
    symbol: "epsilon_beta"
    formula: "epsilon_beta = b · sin(beta) / (m_n · pi)"
    unit: "-"
    printed: "1,083 37"
    value: 1.08337
    decimals: 5
  total_contact_ratio:
    page: 46
    description: "Total contact ratio"
    symbol: "epsilon_gamma"
    formula: "epsilon_gamma = epsilon_alpha + epsilon_beta"
    unit: "-"
    printed: "2,632 46"
    value: 2.63246
    decimals: 5
  transverse_base_pitch_deviation_um:
    page: 46
    description: "Transverse base pitch deviation"
    symbol: "f_pb"
    formula: "f_pb1 = f_pT1 · cos(alpha_t); f_pb2 = f_pT2 · cos(alpha_t)"
    unit: "µm"
    printed: { pinion: "7,950 24 µm", wheel: "8,417 90 µm" }
    pinion: 7.95024
    wheel: 8.41790
    decimals: 5
  pitch_line_velocity_m_s:
    page: 46
    description: "Pitch line velocity"
    symbol: "v_w"
    formula: "v_w = d_w1 · pi · n_1 / (60 · 10^3)"
    unit: "m/s"
    printed: "2,670 35 m/s"
    value: 2.67035
    decimals: 5
  circumferential_velocity_m_s:
    page: 46
    description: "Circumferential velocity at the reference circle (see ISO 6336-1:2019, 4.2.2)"
    symbol: "v"
    formula: "v = d_1 · pi · n_1 / (60 · 10^3)"
    unit: "m/s"
    printed: "2,664 20 m/s"
    value: 2.66420
    decimals: 5
