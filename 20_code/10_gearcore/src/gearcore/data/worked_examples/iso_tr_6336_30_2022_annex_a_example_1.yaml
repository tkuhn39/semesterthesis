    wheel: right
  face_width_mm:
    table: "Table A.1"
    description: "Facewidth"
    symbol: "b"
    unit: "mm"
    printed: { pinion: "b_1 = 100 mm", wheel: "b_2 = 100 mm" }
    pinion: 100.0
    wheel: 100.0
  contact_face_width_mm:
    table: "Table A.1"
    description: "Contact facewidth"
