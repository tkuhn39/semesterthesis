    printed:
      { pinion: "rho_fP1 = 0,39 m_n mm", wheel: "rho_fP2 = 0,39 m_n = 3,12 mm" }
    factor_of_normal_module: { pinion: 0.39, wheel: 0.39 }
    pinion: 3.12
    wheel: 3.12
  residual_fillet_undercut_mm:
    table: "Table A.1"
    description: "residual fillet undercut"
    symbol: "s_pr"
    unit: "mm"
    printed: { pinion: "s_pr1 = 0,00 mm", wheel: "s_pr2 = 0,00 mm" }
    pinion: 0.0
    wheel: 0.0
