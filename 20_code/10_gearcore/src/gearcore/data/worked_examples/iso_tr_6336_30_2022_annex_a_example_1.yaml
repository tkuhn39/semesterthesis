    pinion: 0.14522
    wheel: 0.0
  span_measurement_mm:
    table: "Table A.1"
    description: "Span measurement"
    symbol: "W_k"
    unit: "mm"
    printed: { pinion: "W_k1 = 38,196 mm", wheel: "W_k2 = 307,943 mm" }
    pinion: 38.196
    wheel: 307.943
  number_of_teeth_spanned:
    table: "Table A.1"
    description: "Number of teeth spanned"
    symbol: "k"
    unit: "-"
    printed: { pinion: "k_1 = 2", wheel: "k_2 = 13" }
    pinion: 2
    wheel: 13
  tip_diameter_mm:
    table: "Table A.1"
