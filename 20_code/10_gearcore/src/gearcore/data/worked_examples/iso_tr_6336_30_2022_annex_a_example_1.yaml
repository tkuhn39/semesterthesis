# Worked example transcribed from the rendered norm pages (never from the text layer).
#
# Every entry names the quantity as the norm prints it:
#   <key>        name of the quantity in the registry (data/quantities.yaml) with its unit suffix;
#                `quantity` names the registry entry where the key cannot (involute function)
#   table        table or clause of the norm the row stands in
#   description  label of the row in the norm, verbatim
#   meaning      own clarification where the label alone is ambiguous
#   symbol       symbol as the norm prints it; subscripts follow an underscore, Greek letters are
#                spelled out (alpha, beta, epsilon, rho). Per gear the norm appends 1 (pinion) and
#                2 (wheel). null = the norm prints no symbol.
#                In print the symbol is italic and every subscript upright.
#   unit         unit as printed; `note` says where the norm prints none
#   printed      text as printed (decimal comma, digit groups separated by a space)
#   formula      (expected only) formula of the norm in a plain-text transcription:
#                abs(x) for |x|, atan for the inverse tangent, sqrt for the root
#   decimals     (expected only) number of printed decimals, sets the test tolerance
#   value | pinion, wheel
#                the number the tests use; `tests/test_worked_examples.py` checks that it equals
#                the number in `printed`
#   factor_of_normal_module
#                the norm prints the value as a multiple of m_n; value = factor · m_n
#   derived      gears whose value is not given but follows from the other inputs
# Both sections keep the order of the norm.
id: iso_tr_6336_30_2022_annex_a_example_1
source: ISOTR6336-30:2022
location: "Annex A 'Example 1 detailed calculation': Table A.1 'Gear geometry' (printed p. 43, PDF p. 49), A.6 'Supplementary calculations' (printed p. 45 and 46, PDF p. 51 and 52); single rows of Table A.2 (p. 43) and Table A.5 (p. 45)"
transcribed:
  by: "claude (pdftoppm 150 and 300 dpi, read from the rendered pages)"
  date: "2026-09-29"
  method: visual
  confirmed_by_user: true

# ---- Table A.1 — Gear geometry (printed p. 43), all 19 rows; then the rows of Table A.2 and
# ---- Table A.5 that A.6 uses --------------------------------------------------------------------
inputs:
