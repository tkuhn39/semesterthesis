# Documented differences between gearcore and the STplus oracle (ADR-105), and deliberate
# deviations of gearcore from the current norm.
#
# `differences`: a value that the comparison reports as `different` must be explained here, or it
# is a defect. The current norm is never changed to match STplus.
#
#   field          compared field of the result contract
#   condition      when the difference occurs
#   new            what gearcore computes: current norm, equation, section, printed page
#   old            the same quantity in the norm STplus names as its basis
#   stplus         what STplus prints, with the evidence
#   example        one fixture case with both values
#   effect         what a user has to know
#
# `deviations_from_the_norm`: where gearcore does not follow the letter of the current norm. Each
# entry is a decision of the user with its reason (an ADR), the equation of the norm, what gearcore
# computes instead, and one example with both values. The result names the norm value wherever the
# two differ.
differences: {}

# `not_compared`: quantities STplus prints under a name of the norm but defines differently, and
# choices the program makes by rules of its own. They are left out of the comparison (or compared
# by the rule of the program) and listed here with both definitions.
not_compared:
  diametral_ball_dimension_allowance_factor:
    field: "diametral_ball_dimension_allowance_factor"
    new: { source: "DIN21773:2014", eq: "(60)", section: "14.6", page: 26, formula: "derivative of M_dK with respect to the tooth thickness" }
    stplus: { label: "Abmassfaktor A_Md/A_sn", formula: "A_Mde / A_sne, the ratio of the upper allowances", evidence: "listings of the 18 cases" }
    example: { case: "kst_b_rerun", gear: "pinion", gearcore_value: 2.3087, stplus_value: 2.287 }
    effect: "The two agree to the second order of the allowance; the limits themselves are compared (diametral_two_ball_dimension_mm)."
  chordal_tooth_thickness_allowance:
    field: "chordal_tooth_thickness_at_y_mm"
    new: { source: "DIN21773:2014", eq: "(48) to (53)", section: "14.3", page: 25, formula: "limits of the chord from its allowance factor" }
    stplus: { label: "oberes / unteres Abmass der Z.dickensehne", formula: "the tooth thickness allowances A_sne, A_sni themselves", evidence: "listings of the 18 cases" }
    effect: "The nominal chord and its height are compared; the limits of the chord are not."
  number_of_teeth_spanned:
    field: "number_of_teeth_spanned"
    new: { source: "DIN21773:2014", eq: "(9)", section: "7.2", page: 12, formula: "contact next to the V-cylinder, within Eq. (12), (13)" }
    stplus: { label: "Messzaehnezahl k", formula: "min(INT((k_min + k_max) / 2) + 1, k_max)", evidence: "stplus_program/inspection_choices.json" }
    effect: "Another k is another span over another number of teeth of the same gear. The comparison computes k by the rule of STplus."
  measuring_ball_diameter:
    field: "measuring_ball_diameter_mm"
    new: { source: "DIN3977:1981", eq: "Tabelle 1", section: "4", page: 1, formula: "next larger table value above the ideal ball of DIN 21773 Eq. (26), (27)" }
    stplus: { label: "Messtueckdurchmesser D_M", formula: "table of the program; max(smallest ball above the tip, two values below the ball for the middle of the form circles)", evidence: "stplus_program/inspection_choices.json" }
    effect: "Another ball is another dimension of the same gear. The comparison computes D_M by the rule of STplus."

deviations_from_the_norm:
  common_tooth_depth_with_tip_form_circles:
    field: "common_tooth_depth_mm"
    decision: "user decision 2026-09-30, ADR-112"
    condition: "at least one gear has a tip form diameter below its tip diameter (tip chamfer or edge break flank of the tool)"
    norm: { source: "ISO21771:2014", eq: "(59)", section: "5.2.6", page: 41, formula: "h_w = (d_a1 + d_a2) / 2 - a_w" }
    old_norm: { source: "DIN3960:1987", eq: "(4.2.08)", section: "4.2.6", page: 31, formula: "h_w = (d_a1 + d_a2) / 2 - a" }
    gearcore:
      formula: "h_w = (d_Fa1 + d_Fa2) / 2 - a_w"
      reason: "Beyond the tip form circle, on the tip chamfer, the tooth does not carry. A tip chamfer is used deliberately to control the beginning and the end of the mesh; the depth over which involute flanks can overlap ends at the tip form circles (user, 2026-09-30)."
    stplus:
      formula: "h_gem = (d_Fa1 + d_Fa2) / 2 - a"
      evidence: "reproduces the printed 'gemeinsame Zahnhoehe h_gem' of all 18 listings and 14 interface files within the tolerance of the comparison; the cases with d_Fa < d_a are kst_b, kst_c, kst_e and their re-runs (tool with an edge break flank at the wheel) and chamfer_hk_z20_34 (tip chamfer given as an input on both gears). The printed 'Gemeins. Zahnhoehenfaktor h_*' = h_gem / m_n follows the same rule. The manual gives no definition of h_gem. test_common_tooth_depth_follows_the_tip_form_circles"
    example: { case: "kst_b_rerun", quantity: "h_w", norm_value: 3.205, gearcore_value: 2.917975, stplus_value: 2.91798, unit: "mm" }
    effect: "With a tip chamfer the value of gearcore and of STplus is smaller than the value by the letter of both norms by (d_a - d_Fa) / 2 summed over both gears (0,117 to 0,500 mm in the reference cases, 8 to 12 %). Without a chamfer all agree. The result carries the warning common_tooth_depth_with_tip_form_circles with the value of the tip circles."
